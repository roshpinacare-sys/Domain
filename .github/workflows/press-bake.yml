# press-bake — עיתון-הצי היומי (roadmap B של Task 44).
# אופה press/index.html ממקורות-ציבוריים בלבד — keyless, fail-soft, write-on-change.
# HTML סטטי לחלוטין (אפס-JS) — שום-סקריפט שיכול למות ב-parse (שיעור-Task 41).
# מחוץ-לעדר: עדר-הפאלסים רץ 3,9,23,29,33,49,53 — כאן 17,47.
name: press-bake

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: press-bake
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Bake daily press (keyless, fail-soft)
        run: node tools/bake-press.mjs

      - name: Bake wallet-truth page (zero-JS, W29)
        run: node tools/bake-wallet.mjs

      - name: R-bidi — ensure every baked dir=rtl page carries assets/bidi-fix.js
        run: node scripts/inject-bidi-fix.mjs

      - name: Commit (only when baked content changed)
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          # stall-fix 2026-10-25 (trace 1a173c9512866c89 + גל-80 1a173c3929f5d23d — convergent cure):
          # bake-press also refreshes sitemap.xml (press/editions lastmod, wave-19.49/50) —
          # leaving it unstaged made `git pull --rebase` refuse on EVERY run since Oct 21
          # (baked edition committed but never pushed; ~180 green-but-dead runs). Stage ALL
          # baker outputs (-A -- so any future output drift is covered) and make a failed
          # push loud (exit 1) instead of a silent green lie.
          git add -A -- press wallet-truth.html sitemap.xml
          if git diff --cached --quiet; then
            echo "no-change — the previous edition stands"
          else
            git commit -m "press: daily edition baked $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase -q && git push origin main; then pushed=1; break; fi
              echo "push race #$i — rebasing on the fleet and retrying"
              sleep 3
            done
            if [ "$pushed" != "1" ]; then
              echo "FATAL: baked edition could not be pushed after 3 attempts — failing loudly (no more silent stalls)"
              git status --short
              exit 1
            fi
            echo "EDITION LANDED: press/editions/$(date -u +%F).html is on main"
          fi
          if git diff --cached --quiet; then
            echo "no-change — the previous edition stands"
          else
            git commit -m "press: daily edition baked $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          # stall-fix 2026-10-25 (trace 1a173c9512866c89 + גל-80 1a173c3929f5d23d — convergent cure):
          # bake-press also refreshes sitemap.xml (press/editions lastmod, wave-19.49/50) —
          # leaving it unstaged made `git pull --rebase` refuse on EVERY run since Oct 21
          # (baked edition committed but never pushed; ~180 green-but-dead runs). Stage ALL
          # baker outputs (-A -- so any future output drift is covered) and make a failed
          # push loud (exit 1) instead of a silent green lie.
          git add -A -- press wallet-truth.html sitemap.xml
          if git diff --cached --quiet; then
            echo "no-change — the previous edition stands"
          else
            git commit -m "press: daily edition baked $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase -q && git push origin main; then pushed=1; break; fi
              echo "push race #$i — rebasing on the fleet and retrying"
              sleep 3
            done
            if [ "$pushed" != "1" ]; then
              echo "FATAL: baked edition could not be pushed after 3 attempts — failing loudly (no more silent stalls)"
              git status --short
              exit 1
            fi
            echo "EDITION LANDED: press/editions/$(date -u +%F).html is on main"
          fi
          fi
