#
#
#

name: weave-heart

on:
  schedule:
    # [wave 19.53 · trace 1a15dcfe6e13c1b9] cadence cure at the writer, measured root:
    # the daily 16:29 slot (with GitHub drift landing it 20:02Z) left Console mirror.json
    # 13.7h stale — sovereign.html measured WARN "data 13h old" against the quality
    # law's 6h threshold (quality/report.json 09:03Z). publishConsoleMirror() runs on
    # EVERY beat, including attestation-only (weave-beat.ts 3.7: "רץ בכל פעימה - גם
    # ב-SANDBOX-ALIVE"), and auto mode never takes over while the ledger is fresh
    # (WEAVE_STALE_MIN 1560 unchanged) — so a 4h schedule only adds honest attestations
    # + a fresh public mirror, zero takeover risk. Anchor lines keep their own daily
    # root with Z-18 dedup (already anchored => ALREADY-ANCHORED, honest skip), so the
    # extra dispatches are no-ops there. Publishing-frequency change inside the 15-c
    # delegation (owner standing: הפעל הכל · נייעל · trace 1a15d4de19bd1791).
    - cron: '29 */4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'heartbeat mode — auto: judge from the ledger/git freshness; force-beat: always take over and beat'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - force-beat

permissions:
  contents: write
  actions: write

concurrency:
  group: weave-heart-domain-twin
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the sovereign home
        uses: actions/checkout@v5
        with:
          repository: roshpinacare-sys/Zip
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 1

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile --no-save 2>/dev/null || bun install --no-save

      - name: Prisma client + DB skeleton
        run: bunx prisma generate && bunx prisma db push
        env:
          DATABASE_URL: 'file:${{ github.workspace }}/db/custom.db'

      - name: Refuse honestly while the seal passphrase awaits the operator
        env:
          SEAL_PP: ${{ secrets.WEAVE_SEAL_PASSPHRASE || secrets.MAIN_KEY }}
        run: |
          if [ -z "$SEAL_PP" ]; then
            echo "Neither WEAVE_SEAL_PASSPHRASE nor MAIN_KEY is set in this repository's vault"
            echo "(Settings > Secrets and variables > Actions). The canonical name is preferred;"
            echo "MAIN_KEY is the operator's delivered alias (2026-09-21, both accepted)."
            echo "The heartbeat cannot even verify the ledger without opening the seal (the network key signs"
            echo "every checkpoint) — nothing it could do would be real. The machine refuses honestly,"
            echo "without touching anything, until the operator delivers the passphrase."
            echo "Cloud copy of the secret: the private Zip vault (unreadable by API). Local copy: the"
            echo "operator's personal vault or 'cat .env.local' on a live sandbox. See README - the machine twin."
            exit 1
          fi

      - name: Sovereign beat (verify, or take over if the ledger is stale)
        run: bun scripts/weave-beat.ts
        env:
          DATABASE_URL: 'file:${{ github.workspace }}/db/custom.db'
          WEAVE_SEAL_PASSPHRASE: ${{ secrets.WEAVE_SEAL_PASSPHRASE || secrets.MAIN_KEY }}
          WEAVE_FORCE_BEAT: ${{ inputs.mode == 'force-beat' && '1' || '0' }}
          WEAVE_STALE_MIN: '1560'
          GITHUB_TOKEN: ${{ github.token }}
          WEAVE_OPS_PAT: ${{ secrets.WEAVE_OPS_PAT }}
          WEAVE_STEEM_WIF: ${{ secrets.WEAVE_STEEM_WIF }}
          WEAVE_STEEM_ACCOUNT: acct-01

      - name: Upload beat report (evidence)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: weave-beat-report-domain-twin
          path: sovereign/beat-report.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Dispatch anchor lines (schedule backstop)
        if: always()
        run: |
          set -e
          echo "[twin-heart] משגר את קווי העיגון בעקבות הפעימה (backstop)…"
          gh workflow run weave-anchor-lines.yml --repo roshpinacare-sys/Domain --ref main
          echo "[twin-heart] הקווים שוגרו כרצף אחד — הקדנס: פעימה ⇒ Steem/Hive ⇒ ZERO ⇒ דחיפה"
        env:
          GH_TOKEN: ${{ github.token }}
