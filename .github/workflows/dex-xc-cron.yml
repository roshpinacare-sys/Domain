# DEX-XC (R43 / CR-0073) — THE INTENT GATES, hourly.
#
# The owner demanded the DEX open to more smart networks with routers that can
# receive and swap LARGE sums on every network — "לפתוח את הדקס לעוד רשתות חכמות
# לכולן ושיהיה לנו ראוטרים שנוכל לקבל ולהחליף גם כבר סכומים גדולים על כל רשת".
# This lane ticks the cross-chain intent doors: the door registry (8 networks,
# measured hard-finality clocks, honest bands), the ERC-7683-shaped lifecycle
# (open → resolve → fill → settle/timeout/refund) over ONE deterministic ledger,
# the escrow-identity law, the 2:1 HTLC clock interlock, the bond law (exposure
# ≤ 2× custody), the solver competition (our pools default, P2P roster outbids),
# and the pegout corridor queue (keyless code never broadcasts).
#
# KEYLESS BY LAW: the doors price and gate; the core settles our OWN ledger
# atomically; chain payouts are QUEUED to dex/pegout-queue.json with the corridor
# named — the keyed desks own every broadcast. Fail-soft exit 0; STASIS
# halt-before-read; single-writer atomic books. [skip ci] book commits,
# rebase-first push (parallel runtimes are real).

name: dex-xc

on:
  schedule:
    - cron: '53 */2 * * *' # T-51: 2h :53 on public minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dex-xc
  cancel-in-progress: false

jobs:
  intent-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: intent-gates selftest (fresh process, zero network — the doors judge themselves first)
        run: node agents/dex-xc.cjs selftest

      - name: intent-gates tick (requests → door law → solver → clocks → queue → core settle)
        run: node agents/dex-xc.cjs status

      - name: commit intent-gates books
        run: |
          git config user.name "saos-dex-xc"
          git config user.email "dex-xc@fleet.local"
          git add agents/dex-xc.json agents/dex-xc.md agents/dex-xc-history.jsonl agents/dex-core.json agents/dex-core.md agents/dex-core-history.jsonl dex/xc-intents.json dex/xc-ops.json dex/xc-requests.json dex/pegout-queue.json
          if git diff --cached --quiet; then
            echo "no book delta — quiet tick"
          else
            git commit -m "dex-xc: intent-gates tick $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            for i in 1 2 3; do
              git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main && break
              echo "rebase-push retry $i"; sleep $((i * 5))
            done
          fi
