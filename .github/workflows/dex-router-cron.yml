# DEX-ROUTER (R39 / CR-0069) — THE SWAP NET, hourly.
#
# The owner directed the DEX to swap STEEM/HIVE/BLURT + pegs to real value, to run
# opposing grids on our side of the book, and to build a networked arbitrage market.
# This lane measures the whole venue graph hourly: the internal markets (steem/hive),
# the Hive-Engine wrapped pools (multi-mirror), the SAOS internal AMM mirror, the
# public CEX reference feeds (Binance/MEXC/HTX), and the inherited Z-27 verdict books.
# It quotes the 12-route catalog with honest verdicts, runs the arb net (FLOOR law +
# 1.5% peg-drift halt), and plans the counter-grids anchored to the CEX-implied fair.
#
# KEYLESS BY LAW: the router plans; market-exec / grid-beat (owner-gated) are the only
# signing surfaces. Fail-soft exit 0; STASIS halt-before-read; single-writer atomic
# book (agents/dex-router.json/.md) + append-only history jsonl. [skip ci] book commits,
# rebase-first push (parallel runtimes are real).

name: dex-router

on:
  schedule:
    - cron: '23 */2 * * *' # T-51: 2h :23 on public minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dex-router
  cancel-in-progress: false

jobs:
  swap-net:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: swap-net tick (venue graph + routes + arb + counter-grids)
        run: node agents/dex-router.cjs status

      - name: commit swap-net books
        run: |
          git config user.name "saos-dex-router"
          git config user.email "dex-router@fleet.local"
          git add agents/dex-router.json agents/dex-router.md agents/dex-router-history.jsonl
          if git diff --cached --quiet; then
            echo "no book delta — quiet tick"
          else
            git commit -m "dex-router: swap-net tick $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            for i in 1 2 3; do
              git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main && break
              echo "rebase-push retry $i"; sleep $((i * 5))
            done
          fi
