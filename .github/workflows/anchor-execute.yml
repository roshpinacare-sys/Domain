# ANCHOR-EXECUTE (Z-15, R132) — קצה-הביצוע של T-RELAY-GAS-READY · AGENT-Z
#
# השרשרת המלאה של "דבר-גורר-דבר": הטריגר דורש כל-שעה (2789>730) →
# proof-pipeline מפרסם calldata מוכן-לחתימה בספר (Console/proof/pipeline.json)
# → anchor-execute.mjs מודד הכל (preflight חסר-מפתחות: chainId, גז, יתרה,
# estimateGas מול ה-Relay החי) — וכאן שני-מצבים:
#
#   ברירת-מחדל: DRYRUN שעתי — המדידה חיה ומתועדת ב-Actions, אפס חתימה.
#   עם סוד EVM_ANCHOR_PK ב-Domain: ההעיגון ה-EVM הראשון של הצי יורה אוטומטית
#   (verify-then-sign: מפתח שאינו גוזר את EOA-הספר מסורב קשיח; המפתח בזיכרון-
#   תהליך בלבד; הקבלה נקראת-חזרה מצומת-RPC עצמאי ונדחפת לספר הציבורי).
#
# חוזה-הסודות: EVM_ANCHOR_PK = פרטי-מלא של 0x01Bd…18B37 בלבד (שער-מפעיל).

name: anchor-execute

on:
  schedule:
    - cron: '55 */3 * * *' # R67-A: 2h -> 3h
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anchor-execute
  cancel-in-progress: false

jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout Domain
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ethers (signing path only)
        run: npm install ethers@6.13.4 --prefix /tmp/ethers --omit=dev --no-audit --no-fund --loglevel=error

      - name: Run anchor-execute (DRYRUN without the vault key — FIRE when the operator adds EVM_ANCHOR_PK; the script itself is the honest gate, secrets context is not allowed in `if`)
        env:
          ETHERS_DIR: /tmp/ethers
          EVM_ANCHOR_PK: ${{ secrets.EVM_ANCHOR_PK }}
          CHAIN: OPTIMISM
          RECEIPT_OUT: /tmp/anchor-receipt.json
        run: node agents/anchor-execute.mjs

      - name: Checkout the public book (receipt lands here on a real anchor)
        uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/Console
          ref: main
          token: ${{ secrets.ZIP_PAT }}
          path: console-book
          fetch-depth: 1

      - name: Commit receipt (only if the run produced one — file-existence gate, not a secrets gate)
        run: |
          set -u
          test -f /tmp/anchor-receipt.json || { echo "no receipt — hourly DRYRUN as designed"; exit 0; }
          cd console-book
          cp /tmp/anchor-receipt.json proof/anchor-receipt.json
          git config user.name "anchor-execute[bot]"
          git config user.email "anchor-execute[bot]@users.noreply.github.com"
          git add proof/anchor-receipt.json
          git commit -m "anchor-execute: first EVM anchor of the fleet — receipt + independent read-back [skip ci]"
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main
