# MM-SUPREMACY (תאום-ציבורי ב-Domain) — קדנס-עומד למנוע-העליונות · ריבוני (תבנית-R71)
# =============================================================================
# [R358 · גל-G "הכובד-עובר" · החלטת-הבעלים DECISIONS #39 (trace 1a13b886defe9aad,
#  שידור-חוזר 1a13b912efa8fb9d) — מסלול EXEC-G 2026-10-15]
#
# המדידה-שהצדיקה את התאום: mm-supremacy במקור-הפרטי (saos-dex) טוען בכותרתו
# "תדירות: יומית אחת" — אך **אין-לו שום schedule**: המנוע לעולם לא הריץ-את-עצמו
# (תבנית built-but-not-running של R299/R312 — נמדדה ולא הונחה).
# · התאום-הזה הוא המכונה: דקות-פומביות-בלתי-מוגבלות, פעם-ביום ב-slot-פנוי (:37 —
#   מפת-הדקות-החיה נבדקה מול כל-crons ה-dex ב-Domain: :04/:12/:18/:19/:20s/:24/:26/:41/:46/:50/:52).
# · המקור-הפרטי נשאר הזנקה-ידנית בלבד; החזרת-קדנס-פרטי = קומיט אחד (כנות-מכסה: דקות-פרטיות-נמדדו-אפס).
# · **נייר-בלבד**: selftest-שער + volume-sim דטרמיניסטי → קבלה-מתויגת-sim; אין-נגיעה-בהון,
#   ולכן אין-צורך-בשער-STASIS (הגריד-ההוני — תאום dex-grid — ממשיך-עם-השער-שלו).
# · אפס-סודות-חדשים: ZIP_PAT — אותו-טוקן-שכבר-משמש את תאומי-dex (אומת-חי ב-run 38243950935).
# · הריפו הוא הבית — הענן הוא הבונים (החוק של Task 33).

name: mm-supremacy

on:
  schedule:
    # R358 (2026-10-15): יומי אחד, slot-פנוי :37 (מפת-דקות נמדדה); הזנקה-ידנית בכל-עת.
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mm-supremacy-domain-twin
  cancel-in-progress: false

jobs:
  supremacy:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout the sovereign dex home
        uses: actions/checkout@v5
        with:
          repository: roshpinacare-sys/saos-dex
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 1

      - name: selftest (אינווריאנטות-ברזל — שער; כישלון = אפס-קבלה, דיווח-כן)
        run: |
          set -euo pipefail
          node grids/supremacy-selftest.mjs

      - name: volume-sim (קבלת-ווליום דטרמיניסטית — נייר, מתויג-כן)
        run: |
          set -euo pipefail
          node grids/sim/volume-sim.mjs \
            --receipt grids/state/supremacy-receipt.json \
            --report grids/state/SUPREMACY-RECEIPT.md

      - name: receipt-summary (לוג-הריצה הוא-הקבלה)
        if: always()
        run: |
          if [ -f grids/state/SUPREMACY-RECEIPT.md ]; then
            cat grids/state/SUPREMACY-RECEIPT.md >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          fi

      - name: commit-receipt (קומיט = קבלה-חיצונית; תבנית-הדחיפה של-התאומים)
        run: |
          set -euo pipefail
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add -A grids/state
          if git diff --cached --quiet; then
            echo "receipt unchanged — nothing to commit"
          else
            git commit -m "mm-supremacy: volume receipt $(date -u +%FT%TZ) [seed 20261004] [domain-twin R358] [skip ci]"
            git pull --rebase -X theirs --autostash origin main
            bash scripts/safe-push.sh
          fi
