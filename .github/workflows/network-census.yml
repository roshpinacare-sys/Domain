# network-census — מפקד-המצב של הרשת כולה, על הגריד הציבורי
#
# הפעילות של הצי מתפרשת על עשרות ריפואים ומאות זרימות-עבודה ואין מקום אחד
# שמראה מה חי, מה נכשל ומה שקט. הזרימה הזו מודדת את כל הריפואים כל רבע-שעה
# ומפרסמת network/status.json — אמת יחידה שהדף network/ מציג כמו שהיא.
#
# חוקים: כשל-מדידה = יציאה רמה (fail loud) · קומיט עם rebase-retry כנגד
# גל-הפעימות של הגריד · אין [skip ci] — הסקר הוא בעצמו פעימה.

name: network-census

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: network-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (same-repo)
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}
          fetch-depth: 1

      - name: Measure the whole fleet
        env:
          GH_TOKEN: ${{ secrets.ZIP_PAT }}
        run: node agents/network-census.mjs

      - name: Publish status.json (rebase-retry against the grid wave)
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add network/status.json
          if git diff --cached --quiet; then
            echo "NO-CHANGE: the census found nothing new since the last measurement"
            exit 0
          fi
          git commit -m "network-census: fleet status measured at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ok=0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -X theirs --autostash -q origin main && git push -q origin main; then ok=1; echo "PUSH-OK attempt $i"; break; fi
            echo "push attempt $i rejected (grid race) — rebasing on the freshest main"; sleep $((i*4))
          done
          if [ "$ok" != "1" ]; then echo "CENSUS-PUSH-RACE: the measurement is committed locally; the next run publishes it"; exit 1; fi
