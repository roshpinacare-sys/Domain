name: voice-artery
# trace-1a1321441 · the voice law becomes a machine.
#
# WHY: the owner's law — no machine fingerprints on public pages (curly
# typographic quotes, owner-directive quotes, generic-AI vocabulary). The
# rulebook existed (hub/fleet/style-human) but nothing ENFORCED it, so the
# marks kept landing. Giants enforce standards in CI, not by memo.
#
# WHAT: every hour, scan every live page listed in sitemap.xml (script/style
# excluded) and publish truth/voice.json. Marks = red run (fail-closed).
# Editorial vocabulary findings = reported with counts, never hidden.
on:
  schedule:
    - cron: "9 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: voice-artery
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Domain
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Voice gate (measures the LIVE site, fail-closed)
        run: node agents/voice-gate.mjs

      - name: Publish the voice receipt
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git config user.name "roshpinacare-sys"
          git add truth/voice.json
          git commit -qm "voice-gate verdict [skip ci]" || echo "nothing to commit"
          for i in 1 2 3; do
            if git push -q origin HEAD:main; then echo "voice receipt published"; break; fi
            echo "push attempt $i failed"; sleep $((i*5)); git pull --rebase -X theirs --autostash -q origin main || true
          done
