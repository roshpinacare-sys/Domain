# TWIN-AUDIT (r147-c) — the domain-differentiation watchdog.
#
# The operator's standing complaint (measured 2026-10-02): the public properties
# served near-identical pages (12 cross-repo pairs at text Jaccard 1.0 + intra-Domain
# pairs at 0.981/0.9575). r147-c differentiated the two worst pairs; this flow keeps
# that differentiation honest forever: it re-measures the LIVE sites daily, checks
# every registered pair's distinct-capability evidence, and opens an issue when an
# unregistered pair drifts into near-duplication or a registered pair loses its
# evidence. Keyless against the sites; report committed as a public receipt.
#
# Conventions kept: checkout via ZIP_PAT (the proven watchdog template), Node 20,
# neutral commit identity, node exits 0 and the shell decides the issue gate.

name: twin-audit

on:
  schedule:
    - cron: '19 6 * * *'   # daily 06:19 UTC — off-peak, off the minute map
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: twin-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 1

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Measure the live twin pages (cross-repo + intra-Domain + registry evidence)
        run: node agents/twin-audit.mjs

      - name: Publish the report
        if: always()
        run: |
          git config user.name "twin-audit"
          git config user.email "twin-audit@users.noreply.github.com"
          git add twin-audit/report-*.json twin-audit/latest.json
          if git diff --cached --quiet; then
            echo "report unchanged"
            exit 0
          fi
          NEAR=$(node -e "const l=JSON.parse(require('fs').readFileSync('twin-audit/latest.json','utf8'));console.log(l.crossNearDupPairs+'/'+l.measured.crossPairsMeasured)")
          git commit -m "twin-audit: live twin report $(date -u +%Y-%m-%d) - near-dup ${NEAR} (threshold 0.95)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && { echo "report published (attempt ${attempt})"; exit 0; }
            echo "push failed (attempt ${attempt})"
            sleep 5
          done
          echo "could not publish the report after 3 attempts"
          exit 1

      - name: Issue gate (unknown near-dup pair, or lost capability evidence)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP_PAT: ${{ secrets.ZIP_PAT }}
        run: |
          if [ ! -f /tmp/twin-issue.json ]; then echo "no gate marker"; exit 0; fi
          FIRE=$(node -e "const m=JSON.parse(require('fs').readFileSync('/tmp/twin-issue.json','utf8'));console.log(m.fire?'yes':'no')")
          if [ "$FIRE" != "yes" ]; then
            node -e "const m=JSON.parse(require('fs').readFileSync('/tmp/twin-issue.json','utf8'));console.log('gate clean - no issue ('+(m.unknownNearDups||[]).length+' unknown near-dups, lostEvidence '+(m.lostEvidence||[]).length+')')"
            exit 0
          fi
          node -e "
            const m=JSON.parse(require('fs').readFileSync('/tmp/twin-issue.json','utf8'));
            const fs=require('fs');
            const lines=[];
            for (const u of (m.unknownNearDups||[])) lines.push('- UNKNOWN near-dup pair: `'+u.page+'` at Jaccard '+u.jaccard5);
            for (const l of (m.lostEvidence||[])) lines.push('- DIFFERENTIATED pair lost its capability evidence: `'+l+'`');
            fs.writeFileSync('/tmp/twin-body.md','twin-audit $(date -u +%Y-%m-%d)\n\n'+lines.join('\n')+'\n\nRegistry: agents/twin-registry.json. Fix = give each side one distinct real function, then register it.\n');
          "
          for TOKEN in "$GH_TOKEN" "$ZIP_PAT"; do
            [ -n "$TOKEN" ] || continue
            CODE=$(curl -s -o /tmp/issue-resp.json -w "%{http_code}" -X POST \
              -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" \
              --data-binary @<(node -e "
                const fs=require('fs');
                fs.writeFileSync('/dev/stderr','building issue payload\n');
                const body=fs.readFileSync('/tmp/twin-body.md','utf8');
                process.stdout.write(JSON.stringify({title:'twin-audit: near-duplication detected '+new Date().toISOString().slice(0,10), body}));
              )")
            if [ "$CODE" = "201" ]; then echo "issue opened"; exit 0; fi
            echo "issue attempt failed (HTTP ${CODE})"
          done
          echo "could not open the issue with either token - recorded honestly here"
          exit 0
