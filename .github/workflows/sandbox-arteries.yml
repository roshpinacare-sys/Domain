name: sandbox-arteries
# trace-1a1312f4 · the private-minutes famine fix.
#
# WHAT BROKE (measured live): Sandbox went private (T-66) → its CI counts against
# the private-repo Actions minutes → the quota ran out ~11:38Z → EVERY Sandbox
# workflow (incl. a bare `echo`) fails in ~2s with zero steps. The four office
# arteries (wallet/grid/fleet/tick receipts) stopped flowing → office-pulse
# degraded → the public site showed STALE forever.
#
# THE FIX: run the artery writers HERE, on Domain's PUBLIC minutes (free, not
# metered by the private quota), in a Sandbox checkout authorized by ZIP_PAT,
# then push the honest receipts back. Zero secrets printed; receipts are the
# same files the Sandbox lanes always produced.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [sandbox-arteries]

permissions:
  contents: read

concurrency:
  group: sandbox-arteries
  cancel-in-progress: false

jobs:
  arteries:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Sandbox (the receipts home)
        uses: actions/checkout@v5
        with:
          repository: roshpinacare-sys/Sandbox
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 1
          path: sandbox

      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Tick (sovereign heartbeat receipt)
        id: tick
        working-directory: sandbox
        run: node engine/sovereign-tick.mjs

      # each lane is honest-fail: an engine that exits 1 still wrote its receipt;
      # we keep going so one red lane never silences the others.
      - name: Wallet artery receipt
        if: always()
        working-directory: sandbox
        run: node engine/wallet-verify.mjs || echo "[wallet] lane verdict non-green (receipt written)"

      - name: Grid artery receipt
        if: always()
        working-directory: sandbox
        run: node engine/grid-watch.mjs || echo "[grid] lane verdict non-green (receipt written)"

      - name: Fleet artery receipt
        if: always()
        working-directory: sandbox
        run: node engine/fleet-verify.mjs || echo "[fleet] lane verdict non-green (receipt written)"

      - name: Commit + push receipts back (rebase-safe)
        if: always()
        working-directory: sandbox
        env:
          ZIP_PAT: ${{ secrets.ZIP_PAT }}
        run: |
          git config user.name  "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add receipts/
          if git diff --cached --quiet; then echo "no receipt delta"; exit 0; fi
          git commit -m "[arteries] domain-fed heartbeat: $(date -u +%FT%TZ)"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase -X theirs --autostash --autostash -q "https://x-access-token:${ZIP_PAT}@github.com/roshpinacare-sys/Sandbox.git" main && git push -q "https://x-access-token:${ZIP_PAT}@github.com/roshpinacare-sys/Sandbox.git" main; then
              ok=1; echo "pushed (attempt $i)"; break
            fi
            echo "push race (attempt $i)"; sleep $((i * 4))
          done
          [ "$ok" = "1" ] || { echo "PUSH-FAILED after retries"; exit 1; }
