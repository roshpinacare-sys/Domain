# SAOS-ACT (R243) — the sovereignty bridge: the saos-cockpit engine RUNS HERE.
#
# The endless loop, killed: the sandbox dies ~5x/day; the private repo's
# Actions minutes are billing-walled (measured 2026-10-07 — even `echo hello`
# fails in 3s, zero steps). THIS repo runs on FREE public minutes and ALREADY
# holds the relayed key vault (vault-transfer, 2026-09-29).
#
# What happens here (every 2h + manual):
#   1. checkout the LAW repo (roshpinacare-sys/steem @ saos-cockpit) via ZIP_PAT
#   2. selftest gate — fail-closed (a red selftest = no run, honest alarm)
#   3. ci-act.mjs: CHAIN-JUDGED credential adoption (the chain is the only
#      judge; key material never printed) → ONE engine daily cycle → durable
#      custody anchor (≤1/h, state-stamped) → agent-bus receipts on chain
#   4. engine state flows BACK into saos-cockpit (the book lives in git)
#
# Laws carried: T-80 custody gates (dead soldiers never sign), thinkGate,
# SPAMGATE v1 (docs/ANTI-SPAM-LAW.md — steem-only rails, measured thresholds),
# agent-bus v1 (chain-native mail), zero secret material in any log.

name: saos-act

on:
  schedule:
    - cron: '51 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: saos-act
  cancel-in-progress: false

jobs:
  act:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the law repo (saos-cockpit)
        uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/steem
          ref: saos-cockpit
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 0

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install engine deps
        working-directory: mini-services/saos-engine
        run: bun install --frozen-lockfile || npm i --no-save @noble/hashes @noble/secp256k1

      - name: Selftest gate (fail-closed — red selftest = no run)
        working-directory: mini-services/saos-engine
        run: bun selftest.mjs

      - name: Chain-judged adoption → engine cycle → custody anchor → bus
        working-directory: mini-services/saos-engine
        env:
          SAOS_ACCOUNT: headcorner
          # R276 (Task 22): the LIVE headcorner credential — chain-proven 4/4
          # from the git vault (KEYS-ZIP-2026-10-08, judge matrix 2026-10-08):
          # headcorner STEEM owner/active/posting/memo all match live authorities.
          # Until now this env was honestly absent (no held key matched the chain).
          CI_HEADCORNER_CRED: ${{ secrets.HEADCORNER_CRED }}
          CI_MAIN_KEY: ${{ secrets.MAIN_KEY }}
          CI_STEEM_POSTING_WIF: ${{ secrets.STEEM_POSTING_WIF }}
          CI_STEEM_ACTIVE_WIF: ${{ secrets.STEEM_ACTIVE_WIF }}
          CI_SA_HEAD_ACTIVE: ${{ secrets.SA_HEAD_ACTIVE }}
          CI_WEAVE_STEEM_WIF: ${{ secrets.WEAVE_STEEM_WIF }}
        run: bun ci-act.mjs

      - name: Persist engine state back to the law repo (FF law, no force)
        if: always()
        run: |
          git config user.name "saos-ci-bot"
          git config user.email "saos-ci-bot@users.noreply.github.com"
          git fetch origin saos-cockpit
          BEHIND=$(git rev-list --count HEAD..origin/saos-cockpit)
          if [ "$BEHIND" != "0" ]; then
            echo "remote advanced ($BEHIND ahead) — rebasing state persistence onto it (lawful reconcile, never force)"
            git stash push --include-untracked -m "ci-state-persist" || true
            git rebase origin/saos-cockpit || git rebase --abort
            git stash pop || true
          fi
          git add mini-services/saos-engine/state
          if git diff --cached --quiet; then
            echo "no state changes to persist — honest no-op"
          else
            git commit -m "saos-ci: engine state persistence (public-minutes runner; FF law)"
            git push origin saos-cockpit && echo "STATE-PERSISTED" || echo "PUSH-REFUSED-HONEST-FAIL (state already on chain + logs)"
          fi
