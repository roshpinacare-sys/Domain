#
# dex-activation — THE IGNITION DESK (CR-0077, owner trace 1a135897157a1d75)
#
# The owner looked at the giants table and saw the SAOS DEX row at zero
# ("עמלות 0 נפח כמעט 0 מצטבר כלום") and ordered a sharp activation with heavy
# volume and autonomous flow. The measured root cause: STASIS (active=true, the
# approved brake) halted dex-core + arb-mesh BEFORE-READ since 2026-10-04 — the
# engines ticked hourly and stopped, the pools died, zero volume.
#
# This workflow runs the ignition desk twice an hour: two-sided ladder flow
# around every live pool's mid, drafted by the desk, settled by the CORE's own
# settle law (dust, 5%-depth cap, minOut, 10% wire cap, conservation) through
# DEX_SETTLE_QUEUE (single-writer per queue file — the mesh keeps its own queue).
# Rolling-24h volume/fees are measured from the append-only ledger and published
# so the giants-table row moves honestly (Console giants.mjs merges this book).
#
# Slots :24 and :50 are minute-map registered (free minutes measured 2026-10-13);
# :18 dex-core renews the book first, :24 ignites it, :40 the mesh trades edges,
# :50 ignites again — the DEX breathes four times an hour.
#
# Laws: keyless, internal SIM units only, zero broadcast, zero keys; STASIS
# staged-lane law enforced inside the engines themselves; fail-closed honest
# books; rebase-push twin idiom (parallel runtimes are real).
#

name: dex-activation

on:
  schedule:
    - cron: '24,50 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dex-activation
  cancel-in-progress: false

jobs:
  ignition:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: dex-activation selftest (the drafting laws judge themselves first)
        env:
          FLEET_ACCOUNT: ${{ secrets.FLEET_ACCOUNT }}
        run: node agents/dex-activation.cjs selftest

      - name: dex-core selftest (the settlement engine the desk leans on)
        env:
          FLEET_ACCOUNT: ${{ secrets.FLEET_ACCOUNT }}
        run: node agents/dex-core.cjs selftest

      - name: ignition tick (two-sided ladder → queue → core settle → measured 24h book)
        env:
          FLEET_ACCOUNT: ${{ secrets.FLEET_ACCOUNT }}
        run: node agents/dex-activation.cjs

      - name: commit ignition books (+ the core ledger when a ladder settled)
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          node agents/redact-telemetry.mjs agents/dex-activation.json agents/dex-activation-queue.json agents/dex-core.json || true
          git add agents/dex-activation.json agents/dex-activation.md agents/dex-activation-history.jsonl agents/dex-activation-queue.json agents/dex-core.json agents/dex-core.md agents/dex-core-history.jsonl
          if git diff --cached --quiet; then
            echo "no book delta — quiet tick"
          else
            git commit -m "dex-activation: ignition tick $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            for i in 1 2 3; do
              git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main && break
              echo "rebase-push retry $i"; sleep $((i * 5))
            done
          fi
