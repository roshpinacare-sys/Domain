# WEB-PUBLISH (DOMAIN TWIN) — סוכן הענן של רשת-האחסון הריבונית, על דקות ציבוריות
#
# תאום של web-publish של Zip (OL-14): לוקח חבילות מהדואר הנכנס
# (sovereign/web/inbox של הבית הריבוני) ומעלה אותן לשרשרת Steem
# בסמכות posting בלבד. הקדנס מוסט ל-:03/:23/:43 (המקור: :00/:20/:40).
#
# בלי WEAVE_STEEM_WIF בכספת הזאת, הסוכן עצמו מדלג בכנות ("no-wif")
# והריצה ירוקה — הדואר ממתין, שום דבר לא אובד. מרגע שהמפעיל
# ישלים את הסוד — השידור מתחדש בלי שינוי קוד.

name: web-publish

on:
  schedule:
    - cron: '3,23,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-publish-domain-twin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the sovereign home (Zip via PAT — the twin never forks the book)
        uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/Zip
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 1

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile --no-save 2>/dev/null || bun install --no-save

      - name: Publish inbox packages to Steem (posting authority, RC-gated)
        run: bun scripts/web-publish.ts
        env:
          WEAVE_STEEM_WIF: ${{ secrets.WEAVE_STEEM_WIF }}
          WEAVE_STEEM_ACCOUNT: cashmachine
          WEB_RC_RESERVE: '20000000'
          WEB_RC_BASE: '65000000'
          WEB_RC_PER_CHAR: '320000'
