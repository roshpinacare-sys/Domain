#
# pages-quality-gate — משטח-האיכות (W29).
#   מודד את עמודי-המפתח כל חצי שעה: עומק-תוכן גלוי, תלות-JS, טריות-נתונים,
#   קישורים-פנימיים — ומחויב את הדוח ב-quality/ (report.json + index.html).
#   הדוקטרינה: איכות שלא נמדדת היא טענה. fail-soft — המדידה לא מפילה את עצמה.
name: pages-quality-gate

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages-quality-gate
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: R-bidi self-heal — re-inject bidi-fix.js into any dir=rtl page a parallel writer baked without it
        run: node scripts/inject-bidi-fix.mjs

      - name: Measure every key page (fail-soft)
        run: node tools/pages-quality-audit.mjs

      - name: Commit (only when the measurement changed)
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no-change — the previous measurement stands"
          else
            git commit -m "quality-gate: pages measured $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase -q && git push origin main && break
              echo "push race #$i — rebasing on the fleet and retrying"
              sleep 3
            done
          fi
