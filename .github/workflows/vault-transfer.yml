
name: vault-transfer
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    env:
      PUB_HEX: "3059301306072a8648ce3d020106082a8648ce3d03010703420004acdca7870a0c832c99a39955612bcc85a8842927cabc03cf4c17ab0069a8cca10c90dbf2ee6412609fa1bc54de4183e782f877638e73f77afb48305202a69d3c"
      # D3b (owner order 1a1620a8+1a1629d9): second recipient — private half sealed into vault-home (custody-intake/vault-transfer-priv.enc, CUSTODY-LEDGER c369ea6)
      PUB2_HEX: "3059301306072a8648ce3d020106082a8648ce3d030107034200045f7049341a75eeb71268841601ddb9f3a364dec410145d4e439b5c2d73d06740f281c90d2303e072935f55b43fafcf431a8aea43043a776ac1f7f76d99c10ae4"
      S_MAIN_KEY: ${{ secrets.MAIN_KEY }}
      S_WEAVE_STEEM_WIF: ${{ secrets.WEAVE_STEEM_WIF }}
      S_STEEM_ACTIVE_WIF: ${{ secrets.STEEM_ACTIVE_WIF }}
      S_STEEM_POSTING_WIF: ${{ secrets.STEEM_POSTING_WIF }}
      S_HIVE_ACTIVE_WIF: ${{ secrets.HIVE_ACTIVE_WIF }}
      S_HIVE_POSTING_WIF: ${{ secrets.HIVE_POSTING_WIF }}
      S_BLURT_ACTIVE_WIF: ${{ secrets.BLURT_ACTIVE_WIF }}
      S_EVM_ANCHOR_PK: ${{ secrets.EVM_ANCHOR_PK }}
      S_SA_FLEET_KEYS: ${{ secrets.SA_FLEET_KEYS }}
      S_SA_HEAD_ACTIVE: ${{ secrets.SA_HEAD_ACTIVE }}
      S_WEAVE_OPS_PAT: ${{ secrets.WEAVE_OPS_PAT }}
      S_ZIP_PAT: ${{ secrets.ZIP_PAT }}
      S_AGENTS_WATCH_TOKEN: ${{ secrets.AGENTS_WATCH_TOKEN }}
      S_PERSONAS_KEY: ${{ secrets.PERSONAS_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Write seal script
        run: |
          cat > seal.mjs <<'SEALEOF'
          import crypto from "node:crypto";
          import fs from "node:fs";
          const pubHex = process.env.PUB_HEX;
          const recipRaw = Buffer.from(pubHex, "hex").subarray(-65);
          const names = [
            "MAIN_KEY","WEAVE_STEEM_WIF","STEEM_ACTIVE_WIF","STEEM_POSTING_WIF",
            "HIVE_ACTIVE_WIF","HIVE_POSTING_WIF","BLURT_ACTIVE_WIF","EVM_ANCHOR_PK",
            "SA_FLEET_KEYS","SA_HEAD_ACTIVE","WEAVE_OPS_PAT","ZIP_PAT","AGENTS_WATCH_TOKEN",
            "PERSONAS_KEY",
          ];
          const items = [];
          for (const name of names) {
            const val = process.env["S_" + name];
            if (!val || val.length < 4) { items.push({ name, missing: true }); continue; }
            const eph = crypto.createECDH("prime256v1");
            eph.generateKeys();
            const shared = eph.computeSecret(recipRaw);
            const key = Buffer.from(crypto.hkdfSync("sha256", shared, Buffer.alloc(32), Buffer.from("weave-vault-transfer-1"), 32));
            const iv = crypto.randomBytes(12);
            const c = crypto.createCipheriv("aes-256-gcm", key, iv);
            const ct = Buffer.concat([c.update(val, "utf8"), c.final()]);
            items.push({
              name,
              eph: eph.getPublicKey("hex"),
              iv: iv.toString("hex"),
              tag: c.getAuthTag().toString("hex"),
              ct: ct.toString("hex"),
            });
          }
          const blob = { format: "WEAVE-VAULT-TRANSFER-1", at: new Date().toISOString(), items };
          fs.mkdirSync("vault-blob", { recursive: true });
          fs.writeFileSync("vault-blob/blob.json", JSON.stringify(blob, null, 1));
          // D3b: second recipient blob — identical items sealed to PUB2_HEX (private half lives in vault-home)
          const pub2Hex = process.env.PUB2_HEX;
          const recip2Raw = Buffer.from(pub2Hex, "hex").subarray(-65);
          const items2 = items.map((it) => {
            if (it.missing) return it;
            const eph2 = crypto.createECDH("prime256v1");
            eph2.generateKeys();
            const shared2 = eph2.computeSecret(recip2Raw);
            const key2 = Buffer.from(crypto.hkdfSync("sha256", shared2, Buffer.alloc(32), Buffer.from("weave-vault-transfer-1"), 32));
            const iv2 = crypto.randomBytes(12);
            const c2 = crypto.createCipheriv("aes-256-gcm", key2, iv2);
            const val = process.env["S_" + it.name];
            const ct2 = Buffer.concat([c2.update(val, "utf8"), c2.final()]);
            return { name: it.name, eph: eph2.getPublicKey("hex"), iv: iv2.toString("hex"), tag: c2.getAuthTag().toString("hex"), ct: ct2.toString("hex") };
          });
          fs.writeFileSync("vault-blob/blob2.json", JSON.stringify({ format: "WEAVE-VAULT-TRANSFER-1", recipient: "vault-home-1", at: new Date().toISOString(), items: items2 }, null, 1));
          console.log("sealed items:", items.filter(i => !i.missing).length, "/", names.length, "(zero values printed)");
          SEALEOF
          node seal.mjs

      - name: Commit sealed blob to vault-transfer branch
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git fetch origin vault-transfer || true
          if git rev-parse --verify origin/vault-transfer >/dev/null 2>&1; then
            git switch vault-transfer || git switch -c vault-transfer origin/vault-transfer
          else
            git switch -c vault-transfer
          fi
          mkdir -p vault
          cp vault-blob/blob.json "vault/blob-$(date -u +%Y%m%dT%H%M%SZ).json"
          cp vault-blob/blob2.json "vault/blob2-$(date -u +%Y%m%dT%H%M%SZ).json"
          git add vault/
          git commit -m "vault-transfer: sealed blob $(date -u +%Y-%m-%dT%H:%M:%SZ) · ECDH P-256 · zero plaintext [skip ci]"
          bash scripts/safe-push.sh 5 vault-transfer
