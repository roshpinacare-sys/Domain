# FLEET-CENSUS CRON (CR-0041, fleet Rung 15) — the estate map cadence, WIRED (CR-0040/R14
# booking: "census-cron wiring — the census joins the Actions cadence so the estate map
# self-updates").
#
# fleet-census.cjs is the OFFLINE/KEYLESS/DETERMINISTIC estate-wide census (CR-0040):
# 16 lanes x capability markers, sovereignty counters, blockers with live evidence, wiring
# map, edge series from our own ledgers, 18 sha256 receipts. Until now the map refreshed
# only when a lane ran the desk by hand; this workflow makes the map SELF-UPDATING: one
# honest refresh per day, enough for a sovereignty/blocker drift record that cannot rot.
#
# Laws carried here (all pre-existing, now mechanically enforced on the cadence):
#  · FATE-DEFENSE law #1 — the STASIS breaker is obeyed TWICE: the scheduler checks
#    agents/STASIS.json before the run (healthy no-op, nothing measured, nothing
#    committed), AND the desk itself halts in code BEFORE any lane read on the same
#    file (E32 proves the fresh-process halt). Two independent gates, one law.
#  · KEYLESS — zero operator secrets: the desk reads the LOCAL estate only (no network,
#    no keys); the push back to the book rides the built-in GITHUB_TOKEN (contents: write,
#    same repo). The census never broadcasts, never signs, never touches custody.
#  · DETERMINISTIC + [skip ci] — the desk's stable payload is byte-identical for the same
#    tree (E31 determinism law), so the daily commit is a pure freshness stamp: if nothing
#    drifted, the publish step books a clean exit instead of a noise commit.
#  · CENSUS-DELTA (CR-0042) — after the refresh, fleet-delta.cjs diffs the just-written
#    map against the last COMMITTED map of the SAME perspective and books a drift row into
#    agents/fleet-delta.jsonl ONLY on a real transition (FIRST-DELTA baseline or DRIFT;
#    NO-DRIFT days book nothing — the event-ledger law composes with the no-noise publish
#    law). Blocker transitions key on (id, status); live evidence is excluded, so honest
#    growth (cadence rows) never masquerades as drift. The drift record IS the
#    sovereignty/blocker transition series — the third measurement surface.
#  · SINGLE-LANE-WORKSPACE LAW (CR-0042, found live by the delta desk on its first run) —
#    a checkout of THIS repo alone shows exactly 1/16 lanes: a CI CHECKOUT ARTIFACT, never
#    a real estate state. The census books that diminished view to
#    agents/fleet-census.artifact.json and NEVER touches the canonical 16-lane map; the
#    delta step diffs artifact-vs-artifact (git HEAD), so the CI-perspective drift series
#    is honest and the perspective flip (CI book over full-estate book) can never
#    masquerade as estate drift again — the delta desk refuses cross-estate diffs by law.
#  · Cadence `14 2 * * *` — daily 02:14 UTC, off the whole org minute map (the :00/:30
#    dex pulse, :9/:39 twins, :23/:53 grid ticks, the 03:xx/04:xx/05:xx/06:xx daily block)
#    so the fleet's Actions minutes never collide (reslotted by the minute-map law, R21).
#  · CLAIMS-AUDIT leg (CR-0050, R21) — claims-audit.cjs rides this cadence: every
#    feature_list evidence path must resolve on the tree, the CR-slot law, the suite
#    version/count invariant — the anti-claims instrument the owner demanded ("בדוק את
#    כל הטענות שלך"). The OWNER-LANGUAGE LAW (owner-facing replies = עברית) is encoded
#    in the desk as data and printed on every run.
#  · NO-NOISE COMPARATOR (CR-0050) — the published books carry a moving `at` freshness
#    stamp; the publish step compares STABLE payloads (at stripped) against HEAD and
#    books a clean exit when only stamps moved. The R21 roast caught the latent defect:
#    the old plain `git diff --cached --quiet` would have committed daily timestamp
#    noise, making the "clean exit" claim above a lie — now it is true.

name: fleet-census-cron

on:
  schedule:
    - cron: "14 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fleet-census-cron
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout this repo (the desk is offline — the estate map is measured from the tree itself)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: STASIS brake (FATE-DEFENSE law #1 — the scheduler obeys the breaker too)
        id: brake
        run: |
          ST=$(node -p "JSON.parse(require('fs').readFileSync('agents/STASIS.json','utf8')).active===true")
          echo "active=$ST" >> "$GITHUB_OUTPUT"
          if [ "$ST" = "true" ]; then
            echo "STASIS-HALT fleet-census-cron · the breaker is active — healthy no-op, nothing measured, nothing committed"
          fi

      - name: census refresh (offline, keyless, deterministic — fail-soft exit 0 by design)
        if: steps.brake.outputs.active != 'true'
        run: node agents/fleet-census.cjs

      - name: delta read (artifact-vs-artifact — the CI-perspective drift series)
        if: steps.brake.outputs.active != 'true'
        run: node agents/fleet-delta.cjs --from-git=agents/fleet-census.artifact.json --to=agents/fleet-census.artifact.json --out=agents/fleet-delta.jsonl

      - name: claims audit (CR-0050 — every ledger claim must resolve on the tree)
        if: steps.brake.outputs.active != 'true'
        run: node agents/claims-audit.cjs

      - name: publish the map back to the book
        if: steps.brake.outputs.active != 'true'
        run: |
          set -u
          git config user.name "fleet-census-cron[bot]"
          git config user.email "fleet-census-cron[bot]@users.noreply.github.com"
          git add agents/fleet-census.artifact.json agents/fleet-delta.jsonl agents/claims-audit.json agents/claims-audit.md 2>/dev/null || true
          NODRIFT=$(node -e '
            const fs=require("fs"),cp=require("child_process");
            const strip=(s)=>{try{const o=JSON.parse(s);delete o.at;return JSON.stringify(o);}catch(e){return "UNPARSEABLE";}};
            const staged=cp.execSync("git diff --cached --name-only",{encoding:"utf8"}).split("\n").filter(Boolean);
            const volatile=["agents/fleet-census.artifact.json","agents/claims-audit.json"];
            const real=staged.filter((f)=>!volatile.includes(f));
            let stableSame=true;
            for(const f of volatile){
              if(!staged.includes(f))continue;
              let head=null;
              try{head=cp.execSync("git show HEAD:"+f,{encoding:"utf8"});}catch(e){head=null;}
              if(head===null||strip(head)!==strip(fs.readFileSync(f,"utf8")))stableSame=false;
            }
            console.log((stableSame&&real.length===0)?"no-drift":"drift");
          ')
          if [ "$NODRIFT" = "no-drift" ]; then
            echo "stable payloads identical (only the at-stamps moved) — clean exit, no noise commit"
          else
            git commit -m "fleet-census(ci): artifact+delta+claims $(date -u +%FT%TZ) [skip ci]"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Halt receipt (this shift belongs to the breaker)
        if: steps.brake.outputs.active == 'true'
        run: |
          echo "STASIS-HALT fleet-census-cron · breaker active — the map stands still by law, not by neglect."
          echo "Resume only after root-cause + judge-node green (see agents/STASIS.json resumePolicy)."
