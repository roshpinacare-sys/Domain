# STEEM-POSTING-REPAIR — recovery of the fleet's STEEM posting identities.
#
# Measured 2026-10-07: the hourly anchor line refuses honestly because
# WEAVE_STEEM_WIF matches no live posting authority. The vault map
# SA_FLEET_KEYS (posting WIFs of the fleet) was never matched against the
# live chain for the STEEM posting role. This workflow does that match
# (check) and, in repair mode, relays the matched WIF into WEAVE_STEEM_WIF
# via GitHub's own sealed-box envelope and re-dispatches the anchor line.
#
# Honesty law: key material never printed, never logged — only PUBLIC
# derived keys and chain-visible authorities.

name: steem-posting-repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check: match table only · repair: relay the matched WIF into WEAVE_STEEM_WIF and dispatch the anchor line'
        required: false
        default: 'check'
        type: choice
        options:
          - check
          - repair

permissions:
  contents: read

concurrency:
  group: steem-posting-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Domain
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dhive + libsodium (signing-side only, no key material)
        run: npm install @hiveio/dhive@1.3.6 libsodium-wrappers --no-audit --no-fund --loglevel=error

      - name: Steem posting repair (vault → live-authority match → sealed relay)
        env:
          SA_FLEET_KEYS: ${{ secrets.SA_FLEET_KEYS }}
          WEAVE_OPS_PAT: ${{ secrets.WEAVE_OPS_PAT }}
          REPAIR_MODE: ${{ inputs.mode }}
        run: node agents/steem-posting-repair.cjs
