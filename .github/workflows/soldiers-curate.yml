name: soldiers-curate
on:
  schedule: [{cron: '40 6,18 * * *'}]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: soldiers-curate
  cancel-in-progress: false
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: "checkout the private vault repo (STEEM_REPO_DIR recovery path, econ-desk pattern)"
        uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/steem
          token: ${{ secrets.WEAVE_OPS_PAT }}
          path: steem-home
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: "install signer lib (tri-bridge pattern)"
        run: npm install --prefix /tmp/steemjs steem@0.7.11 --omit=dev --no-audit --no-fund --loglevel=error
      - name: "soldiers lane curation (public external content, chain dedupe, cache-bust read-back)"
        run: NODE_PATH=/tmp/steemjs/node_modules STEEM_REPO_DIR=$GITHUB_WORKSPACE/steem-home MAXVOTES=2 node agents/soldiers-curate.cjs
      - name: commit book
        run: |
          git config user.name "soldiers-curate[bot]"
          git config user.email "soldiers-curate[bot]@users.noreply.github.com"
          git add agents/curation-book.json agents/curation-book.md 2>/dev/null || true
          if git diff --cached --quiet; then echo "no curation changes"; else
            for i in 1 2 3; do
              git -c rebase.autoStash=true pull --rebase origin main >/dev/null 2>&1 || true
              git commit -m "soldiers-curate: fleet curation book $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]" >/dev/null 2>&1 && break || sleep 5
            done
            git push origin main >/dev/null 2>&1 || true
          fi
      - name: upload book (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curation-book
          path: agents/curation-book.json
          retention-days: 14
