# CLOUD-HEART (DOMAIN TWIN) — לב-הענן של SAOS-NET, על דקות-Actions ציבוריות (R71)
#
# הרקע הנמדד: מכסת הדקות של ריפואים-פרטיים מוצתה ב-12:36Z ב-2026-09-20
# (חשבון ה-Free — 2,000 דק'/חודש; הריצות הפרטיות נדחות בטרם-הרצה מאז).
# cloud-heart — המכונה שהייתה הלב החי האחרון של הרשת — מתה עימה:
# הריצה הירוקה האחרונה בביתו הפרטי (steem) הייתה 12:04:24Z, פסק-דין
# SANDBOX-ALIVE, וה-auto-save האחרון של gitkeeper נחת ב-11:34:46Z. מאז —
# שרשרת SAOS-NET קפואה, שום קומיט לא מקדם אותה, שום דופק.
#
# התאום הזה מריץ את אותה המכונה בדיוק — אותו סקריפט (cloud_heartbeat.cjs),
# אותו בית קנוני אחד (steem: sovereign/node/chain.json), אותה בחירת-מנהיג
# עצמאית — מהבית הציבורי Domain, על דקות בלתי-מוגבלות ובחינם.
#
# למה זה בטוח ומדויק:
#   · בחירת המנהיג היא מהשרשרת ומה-git — ללא שירות-תיאום, ללא אמון בין
#     רצים: attest טרי מהשרשרת או git טרי (< 75 דק') ⇒ SANDBOX-ALIVE ⇒
#     אימות-בלבד, שום נגיעה. שניהם ישנים ⇒ TAKEOVER: מחזור agent בודד,
#     פעימת saosnet --live, attest, gitkeeper. ההיסט בקדנס (:17/:47 מול
#     :00/:30 המקורי) מבטיח ששני הלבבות לעולם לא באותו רגע; דחיפת ה-takeover
#     של כל לב מרעננת את אות ה-git ל-~75 דק' ולכן הלב הבא עומד בעצמו —
#     ההתקדמות הכפולה באותו חלון בלתי-אפשרית מהעיצוב עצמו.
#   · אפס סודות-מפעיל: המכונה נבנתה keyless-safe מהיסוד (חותם הצי
#     fleet_keys.enc אינו קיים בריפו — נתיב ה-takeover רץ ב-DRY כן,
#     בדיוק כפי שרץ בהצלחה 14 ימים רצופים, 2026-09-06 עד 2026-09-20,
#     auto-save כל ~90 דק', loop 21). הטוקן היחיד שהתאום צריך —
#     WEAVE_OPS_PAT לצ'קאאוט ודחיפה של steem — כבר בכספת Domain.
#   · הספר אחד: המצב חי ב-steem בלבד; התאום לא מעתיק אותו, הוא מזמין
#     אותו מהמקור ודוחף חזרה אליו. זהות הענן (cloud-heart[bot]) נשמרת
#     מהעיצוב המקורי — חתימת הריצה נאמנה למקור.
#
# חיזוק הריבונות (R71, הוראת המפעיל "נמצא פתרונות ריבוניים טובים יותר"):
# המקור ב-steem הועבר ל-dispatch-בלבד (הקדנס המתוזמן הוסר באותו מסלול
# מסירה) — גם כשמכסת הדקות תחזור בימים הקרובים, הריפואים הפרטיים לא
# יישרפו שוב (התצרוכת שמוצתה את החשבון הייתה ~2,180+ דק'/חודש מול מכסה
# של 2,000). התאומים הציבוריים — הם המכונות; המקורות הפרטיים — גיבוי
# להזנקה ידנית, קומיט אחד מהחזרה.

name: cloud-heart

on:
  schedule:
    - cron: '17,47 * * * *'  # כל 30 דק', בקיזוז מהמקור (:00/:30 ב-steem)
  workflow_dispatch:
    inputs:
      mode:
        description: 'heartbeat mode — auto: judge from the chain; takeover: force cloud command (drill: run the network from its own server while the sandbox is dead); alive: verify only, never act'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - takeover
          - alive

permissions:
  contents: write

concurrency:
  group: cloud-heart-domain-twin
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the sovereign node home (steem via PAT — the twin never forks the book)
        uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/steem
          token: ${{ secrets.WEAVE_OPS_PAT }}
          fetch-depth: 1

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install agent deps (steem · dhive · js-sha3 · tweetnacl)
        run: cd agent && npm install --omit=dev --no-audit --no-fund --loglevel=error

      - name: Cloud heartbeat (watch, or take over if the sandbox died)
        run: node agent/cloud_heartbeat.cjs
        env:
          CLOUD_HEART: '1'
          CLOUD_STALE_MIN: '95'
          CLOUD_FORCE_TAKEOVER: ${{ inputs.mode == 'takeover' && '1' || '' }}
          CLOUD_ALIVE_ONLY: ${{ inputs.mode == 'alive' && '1' || '' }}

      - name: Upload heartbeat report (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-heart-report-domain-twin
          path: agent/cloud_heart_report.json
          retention-days: 14
