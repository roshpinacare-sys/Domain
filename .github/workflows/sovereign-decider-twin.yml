#
# [zai-18] sovereign-decider-twin — ההכרעה-הריבונית על דקות-פומביות
# ═══════════════════════════════════════════════════════════════════
# תקלה-נמדדת (18-a, owner mandate trace 1a13…d975): ה-decider המקורי רץ בריפו-פרטי
# ומכסת-ה-Actions-הפרטית נגמרה — כל-ריצה מתה 0-סטפים, ופקודת-המנהל ישבה חדשה-שעות
# (DIR-20261012-0002, 12:25Z → ללא-ACK עד הערב). התאום הזה מחזיר את הערוץ לחיים:
#   · המוח (decider.py) נשאר בבית-הפרטי — כאן רק דקות-ריצה פומביות.
#   · כל-הפרסום חוזר לבית-הפרטי (state + ledger + board-ACK) — אפס-תוכן-בעלים בלוג-פומבי.
#   · הקבלה-הפומבית = מזהים-וספירות-בלבד (חוק-חשיפה: אין-טקסטים, אין-שמות, אין-ציטוטים).
#   · אידמפוטנטי: אם-המקור חוזר-לחיות (minutes-מתאדסים) שניהם יכולים-לרוץ — ACK-כפול = אותו-מצב.
# דקות :11/:41 — פנויות-במפת-ה-crons של-Domain (המקור הפרטי 4,34 — הפרש-14 דק').
#
name: sovereign-decider-twin

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereign-decider-twin
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout the private engine (decider brain + directives board)
        uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/Sandbox
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 1

      - name: Decide (MEASURE → OPTIONS → SCORE → DECIDE → PUBLISH → VERIFY — same brain, same laws)
        env:
          GITHUB_TOKEN: ${{ secrets.ZIP_PAT }}
          GITHUB_REPOSITORY: roshpinacare-sys/Sandbox
        run: python3 ops/sovereign/DECIDER/decider.py

      - name: Publish back to the private home (state + ledger + board ACK — never public)
        env:
          ZIP_PAT: ${{ secrets.ZIP_PAT }}
        run: |
          set -euo pipefail
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add ops/sovereign/DECIDER/state.json ops/sovereign/DECIDER/ledger.jsonl ops/sovereign/DIRECTIVES/board.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no state change — honest skip"
            exit 0
          fi
          git commit -m "sovereign-decider-twin: $(date -u +%FT%TZ) [skip ci]"
          OK=0
          for i in 1 2 3 4 5; do
            git pull --rebase -q "https://x-access-token:${ZIP_PAT}@github.com/roshpinacare-sys/Sandbox.git" main || true
            if git push -q "https://x-access-token:${ZIP_PAT}@github.com/roshpinacare-sys/Sandbox.git" HEAD:main; then OK=1; break; fi
            echo "push-race #$i — backoff and retry (parallel-writer survival)"
            sleep $((i * 10))
          done
          if [ "$OK" != "1" ]; then echo "PUSH-FAILED-after-retries — fail-closed"; exit 1; fi
          echo "published to the private home (state + ledger + ACK)"

      - name: Public-safe receipt (IDs and counts only — zero owner voice, zero texts)
        run: |
          python3 - << 'PY'
          import json
          try:
              s = json.load(open("ops/sovereign/DECIDER/state.json"))
          except Exception:
              print("receipt: state.json unreadable (honest)")
              raise SystemExit(0)
          d0 = [d for d in s.get("decisions", []) if d.get("id") == "D0-owner-channel"]
          print("receipt: generatedAt", s.get("generatedAt"))
          print("receipt: decisions", [(d.get("id"), d.get("status")) for d in s.get("decisions", [])])
          if d0:
              print("receipt: ackIds", d0[0].get("ackIds"), "· ackCount", d0[0].get("ackCount"))
          print("receipt: degraded", s.get("degraded"))
          PY
