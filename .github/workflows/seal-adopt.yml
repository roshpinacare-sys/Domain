name: seal-adopt

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seal-adopt
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the sovereign home (Zip — the seal target, full lineage)
        uses: actions/checkout@v5
        with:
          repository: roshpinacare-sys/Zip
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 0
          path: zip

      - name: Checkout the fleet home (Domain — the script lives here)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          path: domain

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Adopt the operator's delivered master key as the seal passphrase
        env:
          MAIN_KEY: ${{ secrets.MAIN_KEY }}
        working-directory: zip
        run: node ../domain/scripts/seal-adopt.mjs
