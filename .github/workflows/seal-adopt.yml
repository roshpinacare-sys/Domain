# SEAL-ADOPT (r72) — אימוץ סיסמת-האב שמסר המפעיל כסיסמת החותם.
#
# הרקע (הכל נמדד, 2026-09-21): המפעיל מסר ערך תחת MAIN_KEY
# (12:30:42Z) ואמר שממנו "אפשר לקבל את כל המפתחות". הערך נבדק
# לגמרי ולא זוהה עם שום רשות (12 גזירות × 2 שרשרות, קבלה
# 12:35:03Z; BEAT-ERROR אימות AEAD מול החותם, ריצה 35600471533).
# במקביל — המפתחות עצמם שוחזרו מהשושלת של הבית הריבוני (ה-blob
# הקודם והסיסמה שלפני-הסבב שניהם בהיסטוריית הגיט — פער G3):
# הכתובות זהות למטא ולחותם att 293 החיה, והמפתח מוכח ב-EIP-191.
#
# המכונה הזו מקיימת את דבר המפעיל: הערך שמסר הופך לסיסמת
# החותם (החותם מכיל את מפתח הענן ומפתח הרשת — "כל המפתחות").
# המפתחות לא מוחלפים; רק הסיסמה מתחלפת לזו שהמפעיל מחזיק בידו —
# משמרת מלאה: הכספת הזו (MAIN_KEY), המפעיל עצמו, וכספת Zip
# (צעד 30-שניות של המפעיל להדביק שם את אותה הסיסמה).
#
# בטיחות: אידמפוטנטי (אם החותם כבר נפתח — כלום לא נכתב); סירוב
# כנה לערך קצר מ-20; אימות הכתובות מול המטא וההתחייבות החיה;
# round-trip לפני כל כתיבה; הערך והמפתחות לעולם לא מודפסים;
# הסקריפט חי בבית הריבוני (scripts/seal-adopt.mjs, 52bc7ce).
#
# הפעלה ידנית בלבד. אחרי האימוץ: התאומים קוראים MAIN_KEY
# (fallback) — הלב, קווי-העיגון וה-ZERO נפתחים; הפעלת weave-heart
# תחדש את הספר.

name: seal-adopt

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seal-adopt
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the sovereign home (Zip — full lineage, the seal lives there)
        uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/Zip
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Adopt the operator's delivered master key as the seal passphrase
        env:
          MAIN_KEY: ${{ secrets.MAIN_KEY }}
        run: node scripts/seal-adopt.mjs
