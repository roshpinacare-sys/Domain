#
# conservation identity, the rebalance FLOOR law on our own pool, the pool-side
#
# rebase-first push (parallel runtimes are real).

name: dex-core

on:
  schedule:
    - cron: '18 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dex-core
  cancel-in-progress: false

jobs:
  exchange-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: exchange-core selftest (fresh process, zero network — settle math judges itself first)
        run: node agents/dex-core.cjs selftest

      - name: exchange-core tick (custody probe + settle + routes + arb + grids + attestation)
        env:
          FLEET_ACCOUNT: ${{ secrets.FLEET_ACCOUNT }}
        run: node agents/dex-core.cjs status

      - name: commit exchange-core books
        env:
          FLEET_ACCOUNT: ${{ secrets.FLEET_ACCOUNT }}
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          node agents/redact-telemetry.mjs agents/dex-core.json
          node scripts/exposure-redact.mjs agents/dex-core.json agents/dex-core.md agents/dex-core-history.jsonl agents/arb-mesh.json agents/arb-mesh.md || true
          # THE LEDGER LAW (T-58 honest-custodian, CR-0077): seq never moves backwards.
          # A parallel writer that checked out earlier may hold a stale ledger — if HEAD's
          # core book carries a fresher seq than our working copy, we YIELD ours and commit
          # only what is ours to write. The ledger is monotonic on every lane.
          MINE_SEQ=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('agents/dex-core.json','utf8')).seq||0)}catch(e){console.log(0)}")
          HEAD_SEQ=$(git show HEAD:agents/dex-core.json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).seq||0)}catch(e){console.log(0)}})" || echo 0)
          if [ "${HEAD_SEQ:-0}" -gt "${MINE_SEQ:-0}" ] 2>/dev/null; then
            git checkout HEAD -- agents/dex-core.json agents/dex-core.md agents/dex-core-history.jsonl 2>/dev/null || true
            echo "shift-guard: yielded the core ledger to a fresher HEAD (seq $HEAD_SEQ > $MINE_SEQ)"
          fi
          git add agents/dex-core.json agents/dex-core.md agents/dex-core-history.jsonl
          if git diff --cached --quiet; then
            echo "no book delta — quiet tick"
          else
            git commit -m "dex-core: exchange-core tick $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            for i in 1 2 3; do
              git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main && break
              echo "rebase-push retry $i"; sleep $((i * 5))
            done
          fi
