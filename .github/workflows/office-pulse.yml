# office-pulse - keeps the public page alive (E-series, owner mandate: the office
# opens first, then the network, and everything must be updating, never stale).
# Measures FleetHQ + Sandbox arteries + saos-runtime via PUBLIC APIs only
# (zero secrets, keyless same-repo publish per R26 CR-0054). Book carries
# generatedAt + per-source errors; the page renders the ages honestly.

name: office-pulse

on:
  schedule:
    - cron: "9,29,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # T-72: powers the self-relay dispatch (the writer carries its own clock)

concurrency:
  group: domain-office-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # self-relay sleeps up to 30 min before self-kick
    steps:
      - name: Checkout (keyless - same-repo only)
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 1

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Measure the office + arteries (fail-marked, never silent)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP_PAT: ${{ secrets.ZIP_PAT }}
        run: node agents/office-pulse.cjs

      - name: Publish the book
        if: always()
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add office/data.json
          if git diff --cached --quiet; then echo "no delta - page data unchanged"; exit 0; fi
          git commit -m "office window: $(python3 -c "import json;print(json.load(open('office/data.json'))['verdict'])" 2>/dev/null || echo unknown) $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            if git pull --rebase --autostash -q origin main && git push -q origin main; then ok=1; echo "PUSH-OK attempt $i"; break; fi
            echo "push attempt $i failed, retrying"; sleep $((8 + RANDOM % 10))
          done
          if [ "$ok" != "1" ]; then echo "named terminal: publish-deferred — book on disk, next :09/:29/:49 flight re-lands it"; exit 0; fi

      - name: self-relay (the writer keeps itself alive — T-72 clock-redundancy, Pulse #9 pattern)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          now=$(date +%s)
          wait=5
          echo "relay: dispatching immediately (cron keeps cadence; relay is redundancy, not the clock) — lock released now"
          sleep "$wait"
          code=$(curl -s -o /tmp/relay.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: office-pulse-relay" \
            https://api.github.com/repos/roshpinacare-sys/Domain/actions/workflows/office-pulse.yml/dispatches \
            -d '{"ref":"main"}')
          echo "relay: next tick dispatched http=${code}"; cat /tmp/relay.out || true
          [ "$code" = "204" ] || { echo "named terminal: relay-dispatch-failed"; exit 1; }
