#
#

name: moment-watch

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  # trigger-hardening (measured 2026-10-14): the hourly '7' cron fires only every
  # 5-8h under estate load (runs at 00:34/07:39/15:54/21:12 — gaps of 5-8h for an
  # hourly heart). Same measured disease + medicine as Autonomy's compute-rearm
  # and network-awareness: two VERIFIED frequent beats in this repo (operator-console
  # '0,39 * * * *', fleet-heartbeat '41 * * * *') now double as the pulse. Cheap by
  # law — the watch re-reads the moment and publishes honestly even when unchanged.
  workflow_run:
    workflows: ["operator-console", "fleet-heartbeat"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: moment-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Read the moment (market regime + parity edge + fuel + calls)
        run: node agents/moment-watch.mjs

      - name: Publish the moment state
        if: always()
        run: |
          git add moment/moment.json moment/history.json
          if ! git diff --cached --quiet; then
            REGIME="$(node -e 'try{const d=require("./moment/moment.json");process.stdout.write(d.regime?d.regime.label:"?")}catch{process.stdout.write("?")}')"
            EDGE="$(node -e 'try{const d=require("./moment/moment.json");process.stdout.write(d.liveBook&&d.liveBook.bidSurplusBps!=null?String(d.liveBook.bidSurplusBps)+"bps":"n/a")}catch{process.stdout.write("n/a")}')"
            git config user.name "roshpinacare-sys"
            git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
            for attempt in 1 2 3; do
              git add moment/moment.json moment/history.json
              git commit -m "moment-watch: ${REGIME} · steem-edge ${EDGE} · $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
              git pull --rebase -X theirs --autostash origin main
              if git push; then echo "moment state published (attempt ${attempt})"; exit 0; fi
              echo "push failed (attempt ${attempt}); resetting to origin and re-reading the moment"
              git checkout -- .
              git reset --hard origin/main
              node agents/moment-watch.mjs
            done
            echo "ERROR: could not publish the moment state after 3 attempts"
            exit 1
          else
            echo "no moment state change to publish"
          fi
