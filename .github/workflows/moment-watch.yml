# MOMENT-WATCH - סוכן הבנת-הרגע של הרשת הריבונית (R62)
#
# הדרישה מהמפעיל: "לקבל הבנה של הרגע ולא תמיד לעבוד לפי תוכנית מסודרת
# אלא לחפש הבנות ויכולות ברשת ופוטנציאל ולבחון דרכי מימוש — הריבונות
# חייבת להיות אוטונומית-דינמית."
#
# תדירות: כל חצי-שעה בדקות :12/:42 (ללא חפיפה במפת-הדקות של הצי:
# money-watch :02/:17/:32/:47 · dex-watch :09/:29/:49 · truth-gate :07 ·
# agents-watch :37 · console-publish :45).
# אפס-מפתחות: מקורות ציבוריים בלבד. הסוכן לא זז כסף ולא חותם —
# הוא קורא את הרגע, מתעד, ומכריע את קריאות-הכיוון שלו עצמו
# רק אחרי שהזמן חלף. אימון כמדידה, לא כהבטחה.

name: moment-watch

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moment-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read the moment (market regime + parity edge + fuel + calls)
        run: node agents/moment-watch.mjs

      - name: Publish the moment state
        if: always()
        run: |
          git add moment/moment.json moment/history.json
          if ! git diff --cached --quiet; then
            REGIME="$(node -e 'try{const d=require("./moment/moment.json");process.stdout.write(d.regime?d.regime.label:"?")}catch{process.stdout.write("?")}')"
            EDGE="$(node -e 'try{const d=require("./moment/moment.json");process.stdout.write(d.liveBook&&d.liveBook.bidSurplusBps!=null?String(d.liveBook.bidSurplusBps)+"bps":"n/a")}catch{process.stdout.write("n/a")}')"
            git config user.name "moment-watch"
            git config user.email "moment-watch@users.noreply.github.com"
            for attempt in 1 2 3; do
              git add moment/moment.json moment/history.json
              git commit -m "moment-watch: ${REGIME} · steem-edge ${EDGE} · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git pull --rebase origin main
              if git push; then echo "moment state published (attempt ${attempt})"; exit 0; fi
              echo "push failed (attempt ${attempt}); resetting to origin and re-reading the moment"
              git checkout -- .
              git reset --hard origin/main
              node agents/moment-watch.mjs
            done
            echo "ERROR: could not publish the moment state after 3 attempts"
            exit 1
          else
            echo "no moment state change to publish"
          fi
