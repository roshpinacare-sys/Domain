#
# [wave 19.55 · trace 1a15f267e3a06a41] STALE-WATCHDOG — freshness that measures
# the ARTIFACT, not the clock.
#
# The measured root (2026-10-21 ~15:5xZ census): GitHub's scheduler skips slots
# under load. weave-heart's 12:29Z slot NEVER fired (no scheduled run between the
# 09:52Z dispatch and 15:5xZ — the */4 cadence's first autonomous cycle was
# swallowed); pages-quality-gate (cron "11,41 * * * *") was silent 11:39Z→15:5xZ
# while its own doctrine says "measured every 30 minutes in public"; weave-mirror
# (*/15) landed ~4 runs all day. Every freshness law that trusts ONE cron slot
# eventually lies — the artifact's own age is the only honest clock.
#
# The cure: a cheap keyless watcher reads the three public artifacts and re-fires
# the SPECIFIC broken writer:
#   - Console mirror.json (the weave book's ts) older than 3.5h -> dispatch
#     weave-heart (the book writer is the root; the mirrorers copy it after).
#   - Domain mirror.json lagging the book by >1h -> dispatch weave-mirror
#     (book fresh, the Domain copy hop is the broken one).
#   - quality/report.json older than 45min -> dispatch pages-quality-gate.
#
# Safety (nothing else changes — same law pattern as the 19.53 cadence cure):
#   - weave-heart auto mode NEVER takes over while the ledger is fresh
#     (WEAVE_STALE_MIN 1560) — an extra dispatch is an honest attestation +
#     a fresh public mirror; anchor lines dedupe via Z-18 (honest no-op).
#   - pages-quality-gate is a pure re-measure — extra runs only add honest PASSes.
#   - 45-min per-target hold (state lives in the receipt) prevents dispatch
#     pile-ups while a writer is already healing; a genuinely broken writer
#     still surfaces loudly via its own runs (we keep NOTHING quiet).
#   - The watchdog NEVER edits content — it only re-fires existing writers.
#
# [wave 19.57 · trace 1a16092c97bffe25] THE WATCHDOG ITSELF WAS STARVING.
# Measured 2026-10-21 ~22:3xZ: the */17 watchdog landed ONE scheduled run all day
# (20:09Z) while */15 weave-mirror landed 4 and treasury-route's 4h cron was
# swallowed at EVERY slot since its birth (10-20 20:06Z was its last schedule;
# the capital book aged 5.5h toward the 6h law with NO watchdog coverage).
# Cure class stays the same — never trust a calendar, ride an EVENT:
#   - workflow_run trigger: every completion of the estate's own high-frequency
#     writers (office-worldbeat / dex-core / dex-beat — dozens of runs a day,
#     push-driven, immune to schedule swallowing) re-measures the artifacts.
#   - cancel-in-progress: true — the NEWEST measurement supersedes the stale one;
#     holds live in the committed receipt, so a cancelled re-measure loses nothing.
#   - 4th sensor: agents/money-ledger.json (stamp key "updated") older than 4.5h
#     -> dispatch treasury-route.yml (its 4h cron keeps failing-open; the artifact
#     age is the only honest clock it has).
#
# [wave 19.58 · trace 1a160ad2281f7cd9] THE TRUTH COPY-HOP STARVED — 5th sensor.
# Measured at 19.58 open: truth.html read WARN dataAge 8.7h at the 22:39:47Z gate
# while the Console truth-gate itself was HEALTHY (verdicts 16:37/17:08/19:23/21:39Z
# all SUCCESS) — the broken link was Domain's own mirror-from-console hop: cron
# '48 1-23/2' (~11 slots/day) landed only 08:54/14:41/19:40/22:47 — five slots
# swallowed (14:41→19:40 = 5h), so Domain's truth/latest.json carried a ~14:00Z
# verdict past the 6h law. agent9-truth-watchdog covers truth/agent9.json only —
# nothing watched the Console-verdict copy. Cure (same class, writer-side):
#   - 5th sensor: truth/latest.json (stamp key "at") older than 3.5h -> dispatch
#     mirror-from-console.yml (Domain-local, keyless copy — no cross-repo token
#     needed; if the Console verdict ITSELF is stale, the mirror copies it
#     honestly and Console's own gate/pacemaker owns that clock).
#   - the hop's cadence goes hourly at mirror-from-console.yml (worst-case copy
#     lag halved; copy-only, zero takeover risk).

name: stale-watchdog

on:
  schedule:
    - cron: '*/17 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - office-worldbeat
      - dex-core
      - dex-beat
    types:
      - completed

permissions:
  contents: write
  actions: write

concurrency:
  group: stale-watchdog
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Domain (receipt home)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Measure public artifact ages, re-fire the broken writer
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          python3 - <<'PY'
          import json, datetime, urllib.request, os, subprocess

          NOW = datetime.datetime.now(datetime.timezone.utc)
          def age_h(url, keys=("generatedAt", "generated_at", "at")):
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      d = json.load(r)
                  ts = next((d[k] for k in keys if k in d), None)
                  if not ts:
                      return None, None
                  t = datetime.datetime.fromisoformat(ts.replace("Z", "+00:00"))
                  return round((NOW - t).total_seconds() / 3600, 2), ts
              except Exception:
                  return None, None

          DOMAIN_MIRROR  = "https://roshpinacare-sys.github.io/Domain/mirror.json"
          CONSOLE_MIRROR = "https://roshpinacare-sys.github.io/Console/mirror.json"
          QUALITY        = "https://roshpinacare-sys.github.io/Domain/quality/report.json"
          MONEY_BOOK     = "https://roshpinacare-sys.github.io/Domain/agents/money-ledger.json"
          TRUTH_LATEST   = "https://roshpinacare-sys.github.io/Domain/truth/latest.json"

          (adom, tsdom), (acon, tscon), (aq, tsq) = age_h(DOMAIN_MIRROR), age_h(CONSOLE_MIRROR), age_h(QUALITY)
          (am, tsm) = age_h(MONEY_BOOK, keys=("updated", "at"))
          (at_, tst) = age_h(TRUTH_LATEST, keys=("at", "ts"))

          # truth/latest contract (measured wave 19.61, trace 1a160f64df51f979): the Console truth-gate is
          # semantically gated — on an unchanged verdict it commits NOTHING until the 6h liveness heartbeat
          # ("no commit, Pages quota spared"), so the stamp legitimately ages to ~6h while ALL-GREEN.
          # The 01:21:18Z organic dispatch (run 39705186428) copied an UNCHANGED file — honest proof that a
          # 3.5h threshold mismatches the writer and loops no-op dispatches between 3.5h and 6h.
          # Sensor law: fire only past the SOURCE's own ceiling (6h) + hop margin (1h) = 7h — i.e. only when
          # the 6h heartbeat itself died or the copy hop died. Repair is Domain-local and keyless; if the
          # Console clock itself is dead the mirror copies honestly and Console's gate owns that clock.
          BOOK_STALE_H, COPY_LAG_H, QUALITY_STALE_H, MONEY_STALE_H, TRUTH_STALE_H, HOLD_MIN = 3.5, 1.0, 0.75, 4.5, 7.0, 45

          holds = {}
          try:
              holds = json.load(open("receipts/stale-watchdog/last.json")).get("holds", {})
          except Exception:
              pass

          def held_recently(target):
              ts = holds.get(target)
              if not ts:
                  return False
              return (NOW - datetime.datetime.fromisoformat(ts.replace("Z", "+00:00"))).total_seconds() < HOLD_MIN * 60

          def dispatch(target):
              subprocess.run(["gh", "workflow", "run", target, "--repo", "roshpinacare-sys/Domain", "--ref", "main"],
                             check=True, capture_output=True)

          actions, notes = [], []
          if acon is None:
              notes.append("Console mirror UNREACHABLE — blind sensor, no book decision (honest skip)")
          elif acon > BOOK_STALE_H:
              if held_recently("weave-heart.yml"):
                  notes.append(f"book {acon}h stale but weave-heart dispatched <{HOLD_MIN}min ago — healing in flight")
              else:
                  dispatch("weave-heart.yml")
                  actions.append(f"dispatched weave-heart.yml (book {acon}h > {BOOK_STALE_H}h)")
                  holds["weave-heart.yml"] = NOW.strftime("%Y-%m-%dT%H:%M:%SZ")

          if adom is not None and acon is not None and (adom - acon) > COPY_LAG_H:
              if held_recently("weave-mirror.yml"):
                  notes.append(f"copy lag {round(adom - acon, 2)}h but weave-mirror dispatched <{HOLD_MIN}min ago")
              else:
                  dispatch("weave-mirror.yml")
                  actions.append(f"dispatched weave-mirror.yml (Domain {adom}h vs book {acon}h, lag > {COPY_LAG_H}h)")
                  holds["weave-mirror.yml"] = NOW.strftime("%Y-%m-%dT%H:%M:%SZ")

          if aq is None:
              notes.append("quality report UNREACHABLE — honest skip")
          elif aq > QUALITY_STALE_H:
              if held_recently("pages-quality-gate.yml"):
                  notes.append(f"quality {aq}h stale but gate dispatched <{HOLD_MIN}min ago — re-measure in flight")
              else:
                  dispatch("pages-quality-gate.yml")
                  actions.append(f"dispatched pages-quality-gate.yml (report {aq}h > {QUALITY_STALE_H}h)")
                  holds["pages-quality-gate.yml"] = NOW.strftime("%Y-%m-%dT%H:%M:%SZ")

          if am is None:
              notes.append("money-ledger UNREACHABLE — blind sensor, honest skip")
          elif am > MONEY_STALE_H:
              if held_recently("treasury-route.yml"):
                  notes.append(f"money-ledger {am}h stale but treasury-route dispatched <{HOLD_MIN}min ago — healing in flight")
              else:
                  dispatch("treasury-route.yml")
                  actions.append(f"dispatched treasury-route.yml (money-ledger {am}h > {MONEY_STALE_H}h)")
                  holds["treasury-route.yml"] = NOW.strftime("%Y-%m-%dT%H:%M:%SZ")

          if at_ is None:
              notes.append("truth/latest.json UNREACHABLE — blind sensor, honest skip")
          elif at_ > TRUTH_STALE_H:
              if held_recently("mirror-from-console.yml"):
                  notes.append(f"truth {at_}h stale but mirror-from-console dispatched <{HOLD_MIN}min ago — copy in flight")
              else:
                  dispatch("mirror-from-console.yml")
                  actions.append(f"dispatched mirror-from-console.yml (truth {at_}h > {TRUTH_STALE_H}h)")
                  holds["mirror-from-console.yml"] = NOW.strftime("%Y-%m-%dT%H:%M:%SZ")

          out = {
              "generatedAt": NOW.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "measured": {
                  "domainMirror": {"ageH": adom, "ts": tsdom},
                  "consoleMirror": {"ageH": acon, "ts": tscon},
                  "qualityReport": {"ageH": aq, "ts": tsq},
                  "moneyLedger": {"ageH": am, "ts": tsm},
                  "truthLatest": {"ageH": at_, "ts": tst},
              },
              "thresholds": {"bookStaleH": BOOK_STALE_H, "copyLagH": COPY_LAG_H, "qualityStaleH": QUALITY_STALE_H, "moneyStaleH": MONEY_STALE_H, "truthStaleH": TRUTH_STALE_H, "holdMin": HOLD_MIN},
              "actions": actions,
              "notes": notes,
              "holds": holds,
          }
          os.makedirs("receipts/stale-watchdog", exist_ok=True)
          with open("receipts/stale-watchdog/last.json", "w") as fh:
              json.dump(out, fh, indent=1, ensure_ascii=False)
          print(json.dumps(out, indent=1, ensure_ascii=False))
          PY

      - name: Commit receipt (commit-first, then pull-rebase-retry — never staged-rebase)
        run: |
          set -e
          git config user.name  "stale-watchdog[bot]"
          git config user.email "stale-watchdog[bot]@fleet.local"
          git add receipts/stale-watchdog/last.json
          if git diff --cached --quiet; then
            echo "receipt unchanged — honest no-op"
            exit 0
          fi
          git commit -m "stale-watchdog: artifact ages measured, writers re-fired [skip ci]"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main; then
              if git push; then ok=1; break; fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "publish race $i — backing off"
            sleep $((i * 7))
          done
          if [ "$ok" != "1" ]; then
            echo "publish-deferred (sibling races) — the next slot re-measures honestly; dispatches already fired"
          fi
