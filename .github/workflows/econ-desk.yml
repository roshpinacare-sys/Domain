name: econ-desk
on:
  schedule: [{cron: '14 22 * * *'}]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: econ-desk
  cancel-in-progress: false
jobs:
  econ:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1}
      - name: STASIS gate (mechanical, FATE-DEFENSE law #1 — lane-aware staged preflight)
        id: brake
        run: |
          ST=$(node agents/stasis-gate.cjs general)
          echo "active=$ST" >> "$GITHUB_OUTPUT"
          # agents/stasis-gate.cjs — fail-closed inside; sign-time capital-gate stays armed
      - uses: actions/setup-node@v5
        with: {node-version: 20}
      - name: "install signer (hive-js; R-ECON-3)"
        run: npm install @hiveio/hive-js --omit=dev --silent
      - name: "checkout private steem home (vault recovery path)"
        uses: actions/checkout@v5
        with:
          repository: roshpinacare-sys/steem
          token: ${{ secrets.WEAVE_OPS_PAT }}
          fetch-depth: 1
          path: steem-repo
      - name: "run econ desk"
        if: steps.brake.outputs.active != 'true'
        env:
          SA_FLEET_KEYS: ${{ secrets.SA_FLEET_KEYS }}
          STEEM_REPO_DIR: steem-repo
        run: node agents/econ-desk.cjs
      - name: commit book
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          node agents/redact-telemetry.mjs agents/econ-book.json || true
          git add agents/econ-book.json agents/econ-book.md 2>/dev/null || true
          if git diff --cached --quiet; then echo "no book changes"; else
            for i in 1 2 3; do
              git -c rebase.autoStash=true pull --rebase origin main >/dev/null 2>&1 || true
              git commit -m "econ-desk: real-economy book $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]" >/dev/null 2>&1 && break || sleep 5
            done
            bash scripts/safe-push.sh
          fi
        continue-on-error: true
