# office-worldbeat — פעימת-העולם הקנונית (הלב של המשרד החי, בלי תלות בסנדבוקס)
#
# העולם של מפקדת הצי חי כל הזמן: office/world-state.json מותקדם כל ~5.5 דק'
# לפי זמן-אמת על ידי המנוע המשותף (office/engine.mjs — אותו מנוע בדפדפן
# ובשירות-השידור). כל פתיחת דף מציגה עולם בעיצומה, לא סימולציה שנולדה מחדש.
#
# מדידה חיה 2026-10-12: מתזמן-ה-GitHub הפיל 100% מטריגרי ה-schedule של העורק
# הזה (כל הריצות dispatch, אפס schedule מעולם) — ומגן-ההצתה בתאומת-הדופק נכשל
# HTTP 0/403 כי הרשאת actions:write נמנעה. לכן הלב עצמו נושא עתה שתי תפקידים:
#
#  1. שרשרת-הצתה-עצמית (chain-keepalive): כל ריצה מדדה 4 דק', מוודאת שאין
#     ממשיך חי (queued/in_progress אחר), ומציתה את הבאה. מתזמן-חוץ לא נדרש;
#     ה-cron נשאר רשת-התאוששות בלבד (*/30), כמו גם תאומת-הדופק ושומר-הגריד.
#     כלל-היציבות: מציתה רק אם אין אף ממשיך חי — שרשרת אחת בדיוק, לעולם.
#
#  2. מקצב-הגריד (pacemaker): מודד את גיל הריצה האחרונה של כל עורק-חיים
#     ומצית עורק שעבר את סף-ה-SLA המדוד שלו. הלב דואג לאיברים; אף עורק
#     לא נשאר לבד מול מתזמן שמפיל משבצות.
#
# חוקים: קומיט ישיר same-repo (github.token) · אין [skip ci] · fail loud על
# אי-התאמת מנורסיון ועל מות-שרשרת · כל הצתה עם actions:write מוצהר.

name: office-worldbeat

on:
  schedule:
    - cron: '*/30 * * * *' # רשת-התאוששות בלבד — השרשרת נושאת את הקצב
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: office-worldbeat
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout (keyless — same-repo only)
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 1

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Advance the world
        run: node agents/office-world-tick.mjs

      - name: Commit the world state
        run: |
          git config user.name "office-worldbeat"
          git config user.email "office-worldbeat@agents.roshpinacare-sys"
          git add office/world-state.json office/world-journal.jsonl
          if git diff --cached --quiet; then
            echo "world unchanged — nothing to commit (honest)"
          else
            git commit -m "office-worldbeat: advance the persistent world"
            bash scripts/safe-push.sh
          fi

      - name: Pacemaker + chain-keepalive (the grid never sleeps)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WF="office-worldbeat.yml"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          # עורק-חיים → סף-SLA בדקות (נמדד מהקצב המתוכנן של כל עורק)
          LANES="office-pulse:40|office-pulse-twin:75|office-orders-twin:180|artery-integrity-twin:180|network-census:45|grid-doctor:90"

          # מדידת-גיל מדויקת פר-עורק (שאילתת-ריצה-אחרונה לכל עורק — בלי חלון-דגימה שמפספס עורקים איטיים)
          lane_age_min() {
            curl -s -H "$AUTH" "${API}/actions/workflows/${1}.yml/runs?per_page=1" \
              | jq -r '.workflow_runs[0].created_at // empty' 2>/dev/null
          }
          # הצתה אמיתית עם קוד-HTTP אמיתי (curl — ל-gh api אין דגל -w; נמדד 2026-10-13: הדגל הורג את הפקודה וה-POST לא נשלח)
          ignite() {
            curl -s -o /dev/null -w '%{http_code}' -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" \
              "${API}/actions/workflows/${1}.yml/dispatches" -d '{"ref":"main"}' 2>/dev/null || echo 0
          }

          # ── מקצב-הגריד: מדידה, ואז הצתה של כל עורק שעבר את ספו ──
          NOW=$(date +%s)
          IFS='|' read -ra LANE_ARR <<< "$LANES"
          for lane in "${LANE_ARR[@]}"; do
            NAME="${lane%%:*}"; SLA="${lane##*:}"
            LAST=$(lane_age_min "$NAME")
            if [ -z "$LAST" ]; then
              AGE=999999; echo "pacemaker: ${NAME} — no runs recorded (API read empty)"
            else
              AGE=$(( NOW - $(date -u -d "$LAST" +%s) ))
            fi
            if [ "$AGE" -gt $((SLA * 60)) ]; then
              CODE=0
              for i in 1 2; do
                CODE=$(ignite "$NAME")
                [ "$CODE" = "204" ] && break
                sleep 5
              done
              if [ "$CODE" = "204" ]; then
                echo "pacemaker: ${NAME} stale ($((AGE/60)) min > ${SLA} min) — re-ignited (204)"
              else
                echo "pacemaker: ${NAME} dispatch FAILED (HTTP ${CODE}) — loud; the next beat retries"
              fi
            else
              echo "pacemaker: ${NAME} fresh ($((AGE/60)) min <= ${SLA} min) — no action"
            fi
            sleep 1
          done

          # ── שרשרת-ההצתה-העצמית: מנוחה-קצב, ואז הצתה אם ורק אם אין ממשיך חי ──
          sleep 240
          ACTIVE=$(curl -s -H "$AUTH" "${API}/actions/workflows/${WF}/runs?per_page=20" 2>/dev/null \
            | jq -r '[.workflow_runs[]? | select((.status=="queued" or .status=="in_progress") and (.id|tostring) != "'"${GITHUB_RUN_ID}"'")] | length' 2>/dev/null || echo "ERR")
          if [ -z "$ACTIVE" ] || [ "$ACTIVE" = "ERR" ]; then
            echo "chain: API unreachable — cannot verify a living successor; failing loud"
            exit 1
          fi
          if [ "$ACTIVE" != "0" ]; then
            echo "chain: ${ACTIVE} active successor(s) alive — dedupe holds, no dispatch"
            exit 0
          fi
          CODE=0
          for i in 1 2 3; do
            CODE=$(ignite "${WF%.yml}")
            [ "$CODE" = "204" ] && break
            sleep 10
          done
          if [ "$CODE" = "204" ]; then
            echo "chain: successor ignited (204) — the world never sleeps"
          else
            echo "chain: dispatch FAILED after 3 attempts (HTTP ${CODE}) — run red on purpose; cron + twin + doctor revive"
            exit 1
          fi
