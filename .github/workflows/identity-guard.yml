# IDENTITY-GUARD — DECISIONS #10 enforcement (keyless, fail-loud)
#
# Law: no commit may carry NAME@users.noreply.github.com as author OR
# committer, except the owner identities and github-actions[bot].
# Any other NAME in that namespace maps to a REAL foreign GitHub account —
# measured 2026-10-13 (T-74/T-76): 5 innocent people (Agent-Z/Agent-4/zai-code/
# noreply/R39) were being attributed commits they never made.
#
# This guard fails the push's check-run loudly with the exact violating
# commits. It is intentionally cheap (no secrets, no deps) and lives in every
# active repo so the recurrence the owner saw on 2026-10-13 morning
# (local-beats / dex-beat / decider-twin regressions) can never pass silently.
#
# [wave 19.59 · trace 1a160b931565f17d] THE RANGE BLIND-SPOT, measured: the guard
# caught the REAL violation 73ae187 (agent-9@users.noreply.github.com, pushed from a
# sibling's local clone during the 22:43–22:45Z push storm) — tore loudly twice
# (runs 39688530200/39688790821), then PASSED at 23:02:42Z because the push range
# had moved past the already-landed commit. A landed violation never re-tears.
# Cure class = the org-gitleaks T-w precedent (CONTINUED #50): a weekly REPORT-ONLY
# full-history sweep publishes the measured count + exact commits as a custody
# receipt — the historical wound stays loud WITHOUT daily storming. History
# rewrite itself is irreversible → owner-side (DECISIONS #29).

name: identity-guard

on:
  push:
  workflow_dispatch:         # manual activation of the deep sweep (run-ID proof on demand)
  schedule:
    - cron: '33 6 * * 1'   # weekly Monday deep sweep (report-only custody receipt)

permissions:
  contents: read

concurrency:
  group: identity-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout full history (needed for push-range resolution)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan pushed commits for forbidden identities (author + committer)
        shell: bash
        run: |
          set -euo pipefail
          ALLOWED='^(326012154\+roshpinacare-sys@users\.noreply\.github\.com|roshpinacare-sys@users\.noreply\.github\.com|github-actions\[bot\]@users\.noreply\.github\.com)$'
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="HEAD~40..HEAD"
          else
            RANGE="$BEFORE..$AFTER"
          fi
          echo "identity-guard: scanning $RANGE"
          VIOLATIONS="$(git log --pretty='%H|%ae|%ce|%s' "$RANGE" 2>/dev/null | awk -F'|' '
            ($2 ~ /@users\.noreply\.github\.com$/ || $3 ~ /@users\.noreply\.github\.com$/) &&
            $2 !~ /^326012154\+roshpinacare-sys@/ && $3 !~ /^326012154\+roshpinacare-sys@/ &&
            $2 !~ /^github-actions\[bot\]@/ && $3 !~ /^github-actions\[bot\]@/ &&
            $2 !~ /^roshpinacare-sys@/ && $3 !~ /^roshpinacare-sys@/
          ' || true)"
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::DECISIONS #10 VIOLATION — NAME@users.noreply.github.com identities in pushed commits (maps to a real foreign GitHub account)"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "identity-guard: PASS — 0 forbidden identities in $RANGE"

  deep-sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Full-history identity census (REPORT-ONLY custody receipt)
        run: |
          set -euo pipefail
          # Same law as the push guard, but the whole history: count + name every
          # forbidden-identity commit. This job NEVER fails on findings (report-only,
          # org-gitleaks T-w class) — the wound stays registered and counted; only a
          # scan error fails.
          VIOLATIONS="$(git log --pretty='%H|%ae|%ce|%ad|%s' --date=iso origin/main 2>/dev/null | awk -F'|' '
            ($2 ~ /@users\.noreply\.github\.com$/ || $3 ~ /@users\.noreply\.github\.com$/) &&
            $2 !~ /^326012154\+roshpinacare-sys@/ && $3 !~ /^326012154\+roshpinacare-sys@/ &&
            $2 !~ /^github-actions\[bot\]@/ && $3 !~ /^github-actions\[bot\]@/ &&
            $2 !~ /^roshpinacare-sys@/ && $3 !~ /^roshpinacare-sys@/
          ' || true)"
          COUNT="$(printf '%s' "$VIOLATIONS" | grep -c . || true)"
          echo "identity-guard deep-sweep: FULL-HISTORY census — ${COUNT} forbidden-identity commits on record"
          [ -n "$VIOLATIONS" ] && printf '%s\n' "$VIOLATIONS" || true
          mkdir -p receipts/identity-guard
          python3 - "$COUNT" receipts/identity-guard/deep-sweep.json << 'PYEOF'
          import json, sys, datetime
          count = int(sys.argv[1])
          receipt = {
              "schema": "identity-guard/deep-sweep/1",
              "at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "mode": "report-only",
              "forbiddenIdentityCommits": count,
              "note": "landed violations never re-tear on push ranges; this weekly receipt keeps the count loud; history rewrite = owner-side (DECISIONS #29)",
          }
          with open(sys.argv[2], "w") as fh:
              json.dump(receipt, fh, indent=1)
          PYEOF

      - name: Commit receipt (house pull-rebase-retry law)
        run: |
          set -euo pipefail
          git config user.name "identity-guard[bot]"
          git config user.email "identity-guard[bot]@fleet.local"
          git add receipts/identity-guard/deep-sweep.json
          if git diff --cached --quiet; then
            echo "receipt unchanged — honest no-op"
            exit 0
          fi
          git commit -m "identity-guard deep-sweep: weekly full-history identity custody receipt [skip ci]"
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main; then
              if git push; then ok=1; break; fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "publish race $i — backing off"
            sleep $((i * 7))
          done
          [ "$ok" = "1" ] || echo "publish-deferred (sibling races) — the next weekly slot re-measures honestly"
