# bridge-keeper — the automatic bridge keeper, alive in the cloud
# Closes the measured honesty gap (deposits.html 2026-11-04): "auto: never-run —
# the code exists but no process runs it in the cloud". This workflow IS the process.
# Keyless · fail-soft · verify-then-credit · receipts committed every beat.
name: bridge-keeper

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bridge-keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: run the keeper beat
        run: node agents/bridge-keeper.cjs
      - name: commit receipts (only when the beat changed truth)
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "roshpinacare-sys@users.noreply.github.com"
          git add dex/bridge.json agents/bridge-keeper.json agents/bridge-keeper.md || true
          if ! git diff --cached --quiet; then
            git commit -m "bridge-keeper: beat measured $(date -u +%FT%TZ) [skip ci]" --quiet
            git push origin main --quiet
          else
            echo "no state change — honest no-op commit skipped"
          fi
