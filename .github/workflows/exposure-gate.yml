# exposure-gate — P0-1 enforcement (master plan T6) — T-70: one-voice law
# T-70 fixes (measured roast findings):
#   1. `branches: [main]` was a mangled YAML literal — the push trigger watched a
#      branch that can never exist. Now: main.
#   2. The filing step opened a NEW issue on EVERY failing run (17 duplicates on
#      2026-10-12) and its body said "Violations below" with nothing below.
#      Now: ONE rolling issue per prefix — comment on repeat, close on recovery,
#      scan output attached to the body.
name: exposure-gate
on:
  push:
    branches: [main]
  schedule:
    - cron: '54 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: exposure-gate
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Scan public surface
        id: scan
        run: |
          set -o pipefail
          node scripts/exposure-scan.mjs 2>&1 | tee exposure-scan-output.txt
      - name: One-voice filing (comment-or-create on violation, close on recovery)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          PREFIX='exposure-gate: public-surface violation'
          EXISTING=$(gh issue list --state open --limit 60 --json number,title \
            --jq '.[] | select(.title | startswith("exposure-gate: public-surface violation")) | .number' | head -1 || true)
          OUTCOME="${{ steps.scan.outcome }}"
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" \
                --comment "recovered: exposure scan passed at $(date -u +%FT%TZ) (run ${{ github.run_id }}) — closing per the one-voice law"
              echo "closed #$EXISTING"
            else
              echo "scan clean, no open gate issue"
            fi
            exit 0
          fi
          # failure path — distinguish real violations (exit 1) from a scanner crash (honest gap)
          if [ -f exposure-scan-output.txt ] && grep -q "EXPOSURE-GATE FAIL" exposure-scan-output.txt; then
            KIND='violations found'
            SHOW=$(tail -n 40 exposure-scan-output.txt)
          else
            KIND='scanner crashed (honest gap — NOT evidence of exposure, NOT a recovery either)'
            SHOW=$(tail -n 20 exposure-scan-output.txt 2>/dev/null || echo 'scan output unavailable')
          fi
          {
            echo "run ${{ github.run_id }} — $(date -u +%FT%TZ) — $KIND"
            echo
            echo '```'
            echo "$SHOW"
            echo '```'
            echo
            echo 'Remediation: remove at HEAD; history rewrite is an owner decision only.'
            echo 'One-voice law: this issue updates instead of spawning duplicates; it closes only when a scan PASSES.'
          } > gate-body.md
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file gate-body.md
            echo "commented on #$EXISTING"
          else
            gh issue create --title "$PREFIX detected $(date -u +%F)" --body-file gate-body.md
          fi
