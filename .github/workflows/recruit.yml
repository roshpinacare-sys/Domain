name: recruit
on:
  schedule: [{cron: '40 4 * * *'}]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: recruit
  cancel-in-progress: false
jobs:
  recruit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/Defi
          token: ${{ secrets.WEAVE_OPS_PAT }}
          path: canon-defi
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: "run mechanism desks (evidence for the board)"
        run: |
          node agents/reconcile.cjs || true
          node agents/workflow-audit.cjs || true
          node agents/page-laws.cjs || true
      - name: "run self-recruitment desk"
        run: node agents/recruit.cjs
      - name: "run venture desk (two-sided ledger board, Z-31)"
        run: node agents/venture-desk.cjs
        env: {DEFU_DIR: ${{ github.workspace }}/canon-defi}
      - name: "run harness audit (five-subsystem judge node, Z-35)"
        run: node agents/harness-audit.cjs
        env: {DEFU_DIR: ${{ github.workspace }}/canon-defi}
      - name: "run desk evals (runnable expectations, Z-36)"
        run: node agents/evals/run-evals.cjs
        env: {DEFU_DIR: ${{ github.workspace }}/canon-defi}
      - name: commit board
        run: |
          git config user.name "recruit[bot]"
          git config user.email "recruit[bot]@users.noreply.github.com"
          git add agents/recruitment.json agents/recruitment.md agents/ventures.json agents/ventures.md agents/fills-ledger.json agents/harness-audit.json agents/harness-audit.md agents/evals/eval-results.json agents/evals/eval-results.md agents/reconciliation.json agents/reconciliation.md agents/workflow-audit.json agents/workflow-audit.md agents/page-laws.json agents/page-laws.md 2>/dev/null || true
          if git diff --cached --quiet; then echo "no board changes"; else
            for i in 1 2 3; do
              git pull --rebase origin main >/dev/null 2>&1 || true
              git commit -m "recruit+ventures: army openings + two-sided ledger board $(date -u +%Y-%m-%dT%H:%M:%SZ)" >/dev/null 2>&1 && break || sleep 5
            done
            git push origin main >/dev/null 2>&1 || true
          fi
