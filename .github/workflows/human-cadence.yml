# HUMAN-CADENCE (CR-0065) — the single publisher of the ten soldiers, hourly.
#
# Why hourly: the old stack burst 10 posts in one run (~500ms apart), voted in perfect
# 18-21s cadence, and followed at exact 3s intervals — mechanically detectable, and the
# owner measured it before we did. The cadence desk spreads every social op across
# persona-owned UTC windows (agents/persona-slots.json v2), with seeded per-day jitter,
# quiet hours 00:00-04:59 UTC, and catch-up windows instead of bursts. Most invocations
# are no-ops by design; the public repo's free minutes make that cheap.
#
# Laws carried: STASIS gate (in-code halt-before-read) · verify-then-sign · read-back
# after every op · fail-soft exit 0 · zero secrets in output · internal-only engagement
# until the quality bar lifts · the PROBE-B LAW (never engage posts under 800 chars of
# body, never the word probe) · THE COMMUNITY BREATH (CR-0067: posts land inside
# hive-177702, subscribes are their own staggered lane) · single-writer atomic books
# (agents/human-cadence.json/.md).

name: human-cadence

on:
  schedule:
    - cron: '13 * * * *'   # every hour at :13 — off the busy minutes of the minute-map
  workflow_dispatch:
    inputs:
      mode:
        description: 'blog | curate | social | community | status | all'
        required: false
        default: 'all'
        type: choice
        options: ['all', 'blog', 'curate', 'social', 'community', 'status']

permissions:
  contents: write

concurrency:
  group: human-cadence
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_PATH: /tmp/steemjs/node_modules
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: STASIS gate (mechanical, FATE-DEFENSE law #1 — R24-a, owner directive 2026-10-04)
        id: brake
        run: |
          ST=$(node -p "JSON.parse(require('fs').readFileSync('agents/STASIS.json','utf8')).active===true")
          echo "active=$ST" >> "$GITHUB_OUTPUT"
          if [ "$ST" = "true" ]; then
            echo "STASIS-HALT human-cadence · the breaker is active — capital lanes obey (votes + community capital)"
          fi

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: steem client (steem@0.7.11 — home template)
        run: |
          npm install --prefix /tmp/steemjs steem@0.7.11 --omit=dev --no-audit --no-fund --loglevel=error
          NODE_PATH=/tmp/steemjs/node_modules node -e "require('steem'); console.log('steem-js OK via NODE_PATH')"

      - name: human cadence tick (slots decide; most ticks are quiet)
        if: steps.brake.outputs.active != 'true'
        env:
          SA_FLEET_KEYS: ${{ secrets.SA_FLEET_KEYS }}
        run: node agents/human-cadence.cjs ${{ github.event.inputs.mode || 'all' }}

      - name: community RC top-up gate (honest bookkeeping; LIVE only when armed)
        if: steps.brake.outputs.active != 'true'
        env:
          NODE_PATH: /tmp/steemjs/node_modules
        run: node agents/community-founder.cjs rc

      - name: community chain proof + hive second-home probe (keyless honesty, R38)
        env:
          NODE_PATH: /tmp/steemjs/node_modules
        run: |
          node agents/community-founder.cjs status
          node agents/community-founder.cjs hive

      - name: commit cadence books (secretless)
        run: |
          git config user.name "saos-human-cadence"
          git config user.email "human-cadence@saos.local"
          git add agents/human-cadence.json agents/human-cadence.md agents/cadence-memory.json agents/human-cadence-status.json agents/community-founder.json agents/community-founder.md
          if git diff --cached --quiet; then
            echo "no cadence changes"
          else
            git commit -m "human-cadence: hourly books · $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            ok=0
            for attempt in 1 2 3; do
              if git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main; then
                echo "cadence books published (attempt ${attempt})"; ok=1; break
              fi
              echo "publish failed (attempt ${attempt})"
              sleep 5
            done
            [ "$ok" = "1" ] || { echo "could not publish cadence books after 3 attempts - fail-loud"; exit 1; }
          fi
