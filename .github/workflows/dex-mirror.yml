# [T38 · C-2h] 2026-10-14 — the mirror chases the beat (measured fault, Task 37/38):
# dex-beat publishes the live book to Console (last beat 15:51:35Z) but this mirror
# only reads hourly :52 — and GitHub's scheduler drifts the slot by tens of minutes
# (measured: the 14:52 slot fired 15:33Z). Public Domain Pages therefore served a
# stale book for up to ~1h after every beat (Task 37 had to hand-dispatch the mirror
# to pass A43). The cure is mechanical, not manual: this workflow now ALSO fires on
# the completion of dex-beat (workflow_run), so every published book is chased
# within minutes. The job-level guard admits only definite completions (success or
# failure — the mirror is a truth-chaser: it reads whatever is live on Console and
# no-ops on unchanged); cancelled/unknown completions publish nothing and are not
# chased. No recursion: dex-beat has no push/workflow_run trigger and this mirror's
# commits carry [skip ci]. The hourly :52 slot stays (independent freshness floor).
# Cadence decision stays inside the 15-c delegation (publishing frequency only).
# LESSON-1 (measured on the first chase, run 38599792374): the trigger fires on run
# completion, but the book lands on Console Pages 1-4 min later (rebuild lag) — so a
# chase that finds nothing new re-reads on a bounded cadence (6x50s) before giving up.
#
# [netrun-10-c] 2026-10-17 — failing-streak root cause (netrun q-queue-20261017-09, P1):
# Measured: runs 474-483 (2026-10-16T20:38Z → 2026-10-17T01:32Z) ALL concluded FAILURE
# while every one of them PUBLISHED the live book (publish commits on main, e.g. 2135c1c
# 01:20:31Z, 1cc0a4d 01:33:46Z "dex-mirror: … live engine book mirrored") and the mirror
# step itself exits 0 (reproduced locally at 2d0b5ee: updated=0 kept=11, exit 0). The
# failing step was the tree-wide "Exposure gate": scripts/exposure-scan.mjs scans EVERY
# tracked file of the repo, so exposure-law violations in files this mirror NEVER touches
# (measured at HEAD 2d0b5ee: LIQUIDITY-PLAN-20261016.md, agents/arb-mesh.json,
# agents/arb-mesh.md — 6 findings) turned the mirror red. That coupling fired TWICE in one
# day (runs 460-466 red 05:34→10:08Z, green again 467-473 after a noon fix, re-broken at
# 20:38Z by other lanes' pushes) and the red noise ended with the workflow DISABLED
# MANUALLY on GitHub (state measured 2026-10-17T05:1xZ; zero runs after 01:32 despite the
# hourly :52 cron) — the public page's freshness floor is dead while disabled. Cure: the
# gate step now enforces the SAME law module (scripts/exposure-rules.mjs — one law, two
# enforcers) on the surface this mirror actually writes (dex/ books, git add dex/),
# fail-closed: exit 1 on violations, exit 2 on a scanner crash (honest gap, mirrors
# exposure-gate.yml's distinction). Tree-wide enforcement stays owned by exposure-gate.yml
# (push to main + daily, one-voice rolling issue) — that lane is red at HEAD for the 3
# files above and their remediation ("remove at HEAD") belongs to their owners, not to a
# mirror. The workflow must be RE-ENABLED on GitHub after this fix (owner/UI action —
# needs repo write; a disabled workflow cannot prove itself green).

name: dex-mirror

on:
  schedule:
    - cron: '52 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [dex-beat]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: dex-mirror
  cancel-in-progress: false

jobs:
  mirror:
    # [T38 · C-2h] trigger guard, fail-closed: on workflow_run, chase only definite
    # completions (success/failure — a failed beat may still have published before
    # dying; the mirror reads the live truth and no-ops when unchanged). Schedule
    # and manual dispatch are untouched.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      # [25-d] FLEET_ROSTER_MAP wired (same as Console estate-scrub.yml) — measured fault:
      # without it redact-telemetry ran roster-unresolved, estateScrubStr no-oped and the
      # "belt-and-braces" redact step 4-char-masked account fields instead of ref-keying
      # them ("acct…[redacted]" class measured at HEAD 2026-10-12T21:5xZ) — partial
      # identity, not a pseudonym, and a book that lost its own refs.
      FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Mirror the live engine book (keyless public read)
        run: |
          # [T38 · C-2h] the chase races, measured live three times (runs 38599792374,
          # 38600671163, 38601877401): (1) workflow_run fires when the beat's RUN
          # completes, but the book lands on Console Pages only after a 1-4+ min
          # rebuild — the first chase honestly no-oped; (2) comparing the source
          # against the MIRROR's own version is unsound — a stale mirror satisfies
          # "source > mirror" against an intermediate book and stops while the beat's
          # actual book is still rebuilding (chase-3 landed book-C and never chased
          # book-D). Cure: the TARGET law — read the beat's own published version
          # keylessly from the Console repo's raw main branch (git content, no Pages
          # lag), and poll Pages until it serves >= that target, then mirror once.
          # Raw fetch failure or a non-advancing beat => honest give-up; the hourly
          # :52 floor stays the backstop. Schedule and manual flights stay
          # single-shot (they read a settled book).
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            TARGET=$(curl -fsSL --max-time 20 "https://raw.githubusercontent.com/roshpinacare-sys/Console/main/dex/world.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).version||0))}catch(e){process.stdout.write('0')}})" || echo 0)
            MV=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('dex/world.json','utf8')).version||0))")
            echo "chase: mirror serves ${MV}; the beat published target ${TARGET} (raw Console main)"
            LANDED=0
            if [ "${TARGET}" -gt 0 ] && [ "${TARGET}" -gt "${MV}" ]; then
              for attempt in 0 1 2 3 4 5 6; do
                SV=$(curl -fsSL --max-time 20 "https://roshpinacare-sys.github.io/Console/dex/world.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).version||0))}catch(e){process.stdout.write('0')}})" || echo 0)
                echo "chase attempt ${attempt}: pages ${SV} / target ${TARGET} / mirror ${MV}"
                if [ "${SV}" -ge "${TARGET}" ]; then
                  node agents/dex-mirror.mjs
                  echo "the beat's book (target ${TARGET}, pages ${SV}) landed on chase attempt ${attempt}"
                  LANDED=1
                  break
                fi
                if [ "${attempt}" -lt 6 ]; then
                  sleep 45
                fi
              done
            else
              echo "nothing to chase: target ${TARGET} vs mirror ${MV} (verify-only beat, or the raw fetch failed) — the hourly :52 floor backstops"
            fi
            if [ "${LANDED}" -eq 0 ] && [ "${TARGET}" -gt 0 ]; then
              echo "chase exhausted: pages never reached target ${TARGET} — honest give-up, the hourly :52 floor backstops"
            fi
          else
            node agents/dex-mirror.mjs
          fi

      - name: Publish the mirrored book
        if: always()
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          node agents/redact-telemetry.mjs dex/grid.json dex/world.json dex/state.json dex/credits.json dex/portfolio.json dex/onramp.json dex/showcase.json dex/relay.json
          git add dex/
          if git diff --cached --quiet; then
            echo "mirror unchanged - the live book is already ours"
            exit 0
          fi
          for attempt in 1 2 3; do
            node agents/redact-telemetry.mjs dex/grid.json dex/world.json dex/state.json dex/credits.json dex/portfolio.json dex/onramp.json dex/showcase.json dex/relay.json
          git add dex/
            git commit -m "dex-mirror: $(date -u +%Y-%m-%dT%H:%M:%SZ) · live engine book mirrored from the live Console mirror (keyless) [skip ci]"
            git pull --rebase -X theirs --autostash origin main
            if git push; then echo "mirror published (attempt ${attempt})"; exit 0; fi
            echo "push failed (attempt ${attempt}); resetting to origin and re-mirroring"
            git checkout -- .
            git reset --hard origin/main
            node agents/dex-mirror.mjs
            node agents/redact-telemetry.mjs dex/grid.json dex/world.json dex/state.json dex/credits.json dex/portfolio.json dex/onramp.json dex/showcase.json dex/relay.json
          git add dex/
            if git diff --cached --quiet; then
              echo "after re-mirror there is nothing to commit - the live book is already ours"
              exit 0
            fi
          done
          echo "named terminal: publish-deferred - live book re-mirrored at next :52 flight (anti-storm 5: record, not alarm)"
          exit 0
      # [netrun-10-c] scope fix: the gate judges WHAT THE MIRROR WRITES (dex/ books),
      # with the same law module the producer gate (agents/dex-mirror.mjs) runs — not the
      # whole tree. A tree-wide scan here coupled this mirror's conclusion to unrelated
      # lanes' content (measured failing-streak above); the tree-wide law has its own
      # dedicated enforcer: exposure-gate.yml (one-voice issue lane).
      - name: Exposure gate (one-law-two-enforcers — the dex/ books the mirror just wrote must PASS)
        run: |
          node -e '
            const fs = require("node:fs");
            import("./scripts/exposure-rules.mjs").then(({ violations, FORBIDDEN_PATHS }) => {
              const files = fs.readdirSync("dex").filter((f) => f.endsWith(".json")).sort().map((f) => "dex/" + f);
              const findings = [];
              for (const p of files) {
                for (const fp of FORBIDDEN_PATHS) if (fp.test(p)) findings.push({ p: p, why: "forbidden path" });
                const body = fs.readFileSync(p, "utf8");
                for (const v of violations(body, p)) findings.push({ p: p, why: v.why });
              }
              if (findings.length) {
                console.error("EXPOSURE-GATE FAIL (dex/ mirror surface) - violations:");
                for (const f of findings.slice(0, 40)) console.error("  x " + f.p + " - " + f.why);
                process.exit(1);
              }
              console.log("exposure-gate: PASS - " + files.length + " mirrored-book files scanned (dex/ write surface), 0 violations");
            }).catch((e) => { console.error("gate crash (honest gap, NOT a recovery): " + String((e && e.message) || e)); process.exit(2); });
          '
