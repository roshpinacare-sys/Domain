#
#
# [zai-13a] 2026-10-11 — חקירת-שורש AMBER (grid 36.6ש׳ / world 31.9ש׳ כשנמדדו ב-20:30Z):
# המקור ב-Console בריא (grid-pulse keyless 2×/יום, כל-הריצות האחרונות הצלחה; dex-beat-twin מפרסם כל 4-8.6ש׳) —
# העותקים כאן הזדקנו כי המראה הזו לא ירתה כלל ב-10-11: מתוזמנת יומית 12:50 (R67-C) אך GitHub דילג/עיכב
# (ריצה אוטומטית אחרונה 10-10T17:29Z, ריצה 38071927915 — סטייה +4.7ש׳ מהמוצהר; אפס ריצות ב-10-11 עד dispatch 38181551164).
# פער-מוצהר↔מפת-הדקות: minute-map.json ו-watch.mjs מצהירים "שעתי :52" וה-scheduler-audit (10-04) מדד DEGRADED
# (צפוי 23/נצפה 10) — אך R67-C ("3h -> daily") היא החלטה מוצהרת בקוד. לא שינינו את התזמון בלי מילת-owner;
# ההמלצה המדודה: השבת '52 * * * *' (מפת-הדקות) כדי שחוק-הטריות 24ש׳ יעמוד גם בסטיות-התזמון של GitHub.
#
# [zai-13a] FILES += onramp/showcase/relay (WO-unwired-dex-mirror P1) — גם בשלוש שורות-ה-redact למטה, אחת-לאחת.
#
# [zai-15c] 2026-10-12 — הכרעת-R67-C (dex-mirror cadence) — החלטה-מכונה מתועדת-כנות:
#   cron '50 12 * * *' (יומי, R67-C) -> '52 * * * *' (שעתי :52 — המשבצת של minute-map.json, Z-71 "הקבצים-הם-האמת-התפעולית").
#   עדות-מדודה: (1) היומי 12:50 לא-ירה כלל ב-10-11 (ריצה-אוטומטית-אחרונה 10-10T17:29Z run 38071927915, סטייה +4.7ש׳) —
#   חוק-הטריות 24ש׳ נשבר; שעתי סובל-דילוגי-GitHub בלי-לשבור-חוק. (2) תקדים R68-E: הדיאטה-היומית של R67-C על-workflows
#   בריפו-ציבורי (weave-heart/weave-anchor-lines) שוחזרה-כבר-לשעתי — "zero minutes saved" — והמראה-הזו ציבורית-וחסרת-מפתחות
#   (mirror-only, exit-מוקדם-כשאין-שינוי), כלומר-הדיאטה-כאן-חסכה-אפס-דקות-ושברה-טריות. (3) ההמלצה-המדודה של 13-a
#   ("השבת '52 * * * *'") נשארה-פתוחה-כ"החלטת-owner-היחידה" — הבעלים האציל-מעמד (trace 1a1…4671
#   "האוטונומיה-זורמת-לבד · פתח-הכל · חפש-בעיות-ותקן") ושורת-COORDINATION 15-c מממשת-את-ההכרעה בגבולות-האצלה:
#   אין-חתימה, אין-הון, אין-סודות — שינוי-תדירות-פרסום-בלבד. משבצת-דקה 52 פנויה (רק dex-mirror תובע-אותה במפת-44-המכונות).
#   החלטה: חוזרים ל-'52 * * * *'. R67-C עצמה (חסכון-מכסה במקורות-פרטיים) נותרת-בתוקף לשאר-המפיקים.

# [T38 · C-2h] 2026-10-14 — the mirror chases the beat (measured fault, Task 37/38):
# dex-beat publishes the live book to Console (last beat 15:51:35Z) but this mirror
# only reads hourly :52 — and GitHub's scheduler drifts the slot by tens of minutes
# (measured: the 14:52 slot fired 15:33Z). Public Domain Pages therefore served a
# stale book for up to ~1h after every beat (Task 37 had to hand-dispatch the mirror
# to pass A43). The cure is mechanical, not manual: this workflow now ALSO fires on
# the completion of dex-beat (workflow_run), so every published book is chased
# within minutes. The job-level guard admits only definite completions (success or
# failure — the mirror is a truth-chaser: it reads whatever is live on Console and
# no-ops on unchanged); cancelled/unknown completions publish nothing and are not
# chased. No recursion: dex-beat has no push/workflow_run trigger and this mirror's
# commits carry [skip ci]. The hourly :52 slot stays (independent freshness floor).
# Cadence decision stays inside the 15-c delegation (publishing frequency only).
# LESSON-1 (measured on the first chase, run 38599792374): the trigger fires on run
# completion, but the book lands on Console Pages 1-4 min later (rebuild lag) — so a
# chase that finds nothing new re-reads on a bounded cadence (6x50s) before giving up.

name: dex-mirror

on:
  schedule:
    - cron: '52 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [dex-beat]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: dex-mirror
  cancel-in-progress: false

jobs:
  mirror:
    # [T38 · C-2h] trigger guard, fail-closed: on workflow_run, chase only definite
    # completions (success/failure — a failed beat may still have published before
    # dying; the mirror reads the live truth and no-ops when unchanged). Schedule
    # and manual dispatch are untouched.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      # [25-d] FLEET_ROSTER_MAP wired (same as Console estate-scrub.yml) — measured fault:
      # without it redact-telemetry ran roster-unresolved, estateScrubStr no-oped and the
      # "belt-and-braces" redact step 4-char-masked account fields instead of ref-keying
      # them ("acct…[redacted]" class measured at HEAD 2026-10-12T21:5xZ) — partial
      # identity, not a pseudonym, and a book that lost its own refs.
      FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Mirror the live engine book (keyless public read)
        run: |
          # [T38 · C-2h] the chase race, measured live twice (runs 38599792374,
          # 38600671163): workflow_run fires when the beat's RUN completes, but the
          # book lands on Console Pages only after a 1-4 min rebuild — the first
          # chase honestly no-oped (pre-rebuild book); the second landed an
          # intermediate book while a newer one was still rebuilding (the loop
          # stopped at the first diff). Cure: a VERSION-AWARE chase — on chase
          # flights, poll the source until its world.json version EXCEEDS the
          # version this repo currently serves, then mirror once. No intermediate
          # landing, no false stop; bounded (7 reads x 45s ≈ 5 min) and the hourly
          # :52 floor stays the backstop. Schedule and manual flights stay
          # single-shot (they read a settled book).
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            MV=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('dex/world.json','utf8')).version||0))")
            echo "chase: this repo serves world version ${MV}"
            LANDED=0
            for attempt in 0 1 2 3 4 5 6; do
              SV=$(curl -fsSL --max-time 20 "https://roshpinacare-sys.github.io/Console/dex/world.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).version||0))}catch(e){process.stdout.write('0')}})" || echo 0)
              echo "chase attempt ${attempt}: source version ${SV} vs mirror ${MV}"
              if [ "${SV}" -gt "${MV}" ]; then
                node agents/dex-mirror.mjs
                echo "the beat's book (version ${SV}) landed on chase attempt ${attempt}"
                LANDED=1
                break
              fi
              if [ "${attempt}" -lt 6 ]; then
                sleep 45
              fi
            done
            if [ "${LANDED}" -eq 0 ]; then
              echo "chase exhausted: source never advanced past version ${MV} — honest give-up, the hourly :52 floor backstops"
            fi
          else
            node agents/dex-mirror.mjs
          fi

      - name: Publish the mirrored book
        if: always()
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          node agents/redact-telemetry.mjs dex/grid.json dex/world.json dex/state.json dex/credits.json dex/portfolio.json dex/onramp.json dex/showcase.json dex/relay.json
          git add dex/
          if git diff --cached --quiet; then
            echo "mirror unchanged - the live book is already ours"
            exit 0
          fi
          for attempt in 1 2 3; do
            node agents/redact-telemetry.mjs dex/grid.json dex/world.json dex/state.json dex/credits.json dex/portfolio.json dex/onramp.json dex/showcase.json dex/relay.json
          git add dex/
            git commit -m "dex-mirror: $(date -u +%Y-%m-%dT%H:%M:%SZ) · live engine book mirrored from the live Console mirror (keyless) [skip ci]"
            git pull --rebase -X theirs --autostash origin main
            if git push; then echo "mirror published (attempt ${attempt})"; exit 0; fi
            echo "push failed (attempt ${attempt}); resetting to origin and re-mirroring"
            git checkout -- .
            git reset --hard origin/main
            node agents/dex-mirror.mjs
            node agents/redact-telemetry.mjs dex/grid.json dex/world.json dex/state.json dex/credits.json dex/portfolio.json dex/onramp.json dex/showcase.json dex/relay.json
          git add dex/
            if git diff --cached --quiet; then
              echo "after re-mirror there is nothing to commit - the live book is already ours"
              exit 0
            fi
          done
          echo "named terminal: publish-deferred - live book re-mirrored at next :52 flight (anti-storm 5: record, not alarm)"
          exit 0
      - name: Exposure gate (one-law-two-enforcers — the tree the mirror just touched must PASS)
        run: node scripts/exposure-scan.mjs
