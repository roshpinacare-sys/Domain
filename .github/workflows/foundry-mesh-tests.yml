name: foundry-mesh-tests

# B-2 (R130) twin: the mesh contract test gate runs HERE (public repo,
# free Actions minutes) because the private platform repo's Actions quota
# is exhausted (BlobNotFound signature — known since 2026-09-20).
# Proves the audit-fix v5 regression law on
# saos-sovereign-platform@fleet/r130:
#   - SAOSLedger: MINT_CAP fail-closed, attributed transfers, 2-step ownership
#   - SAOSExchange: harvest debit-then-credit (no phantom supply),
#     deposit attribution (wrap race closed)
#   - SAOSBridge: monotonic, evidence-backed anchors
# 46 tests. Red here = the economy's law is broken = BLOCKS the ladder.

on:
  push:
    paths: [".github/workflows/foundry-mesh-tests.yml"]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout platform repo (fleet/r130)
        uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/saos-sovereign-platform
          ref: fleet/r130
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show toolchain
        run: forge --version

      - name: Run mesh contract tests
        run: forge test -vvv
