# PUBLIC-PULSE (r147-c) — refreshes the public pulse books (public/pulse.json +
# about/team.json) that only the Domain faces serve. Keyless: composes from the
# committed books of this repository (audience/latest.json, agents/scout-latest.json,
# agents/truth-baseline.json, moment/moment.json, agents/capability-matrix.json).
#
# R26 (CR-0054) KEYLESS WAVE: the workflow passes NO secret env anymore. The old
# PULSE_URL secret-env reference was DEAD WEIGHT — verified via the GitHub API
# (R26) that no PULSE_URL secret is configured on this repo, so it resolved to an
# empty string on every run since day one while miscounting this flow as
# owner-secret. The optional env hook stays in agents/public-pulse.cjs (if a
# home-platform feed is ever declared, wire it as a vars. reference — the desk
# still refreshes from it first and says so in the book; honesty over
# freshness-faking, every run). Same-repo checkout/push = built-in github.token.

name: public-pulse

on:
  schedule:
    - cron: '4 6 * * *'    # daily 06:04 UTC — before twin-audit (06:19) so the books it checks are fresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (keyless — same-repo only, R26 CR-0054)
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 1

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compose the pulse books (keyless, fail-soft)
        run: node agents/public-pulse.cjs

      - name: Publish the books
        if: always()
        run: |
          git config user.name "public-pulse"
          git config user.email "public-pulse@users.noreply.github.com"
          git add public/pulse.json about/team.json agents/receipts/public-pulse-receipt.json
          if git diff --cached --quiet; then
            echo "books unchanged"
            exit 0
          fi
          git commit -m "public-pulse: refresh public pulse books $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && { echo "books published (attempt ${attempt})"; exit 0; }
            echo "push failed (attempt ${attempt})"
            sleep 5
          done
          echo "could not publish the books after 3 attempts"
          exit 1
