# WEAVE-ANCHOR-PING (DOMAIN HUB) — sovereign cadence for the external-witness anchor line
#
# The measured gap (Task 18, 2026-10-02): Zip's weave-anchor-lines is dispatch-only
# (workflow_dispatch) and its pinger lived in the sandbox — every sandbox reset orphans
# the chain and the saos.weave.core.v1 core anchor goes stale (observed: last green
# heart 00:00:27Z, then 21+ hours of silence; A31 red; agent-verify 52/53).
#
# The fix follows the org-gitleaks precedent: the PUBLIC Domain repo owns the cadence
# (unlimited free Actions minutes) and pings the private Zip workflow through the
# proven ZIP_PAT checkout token (already in the Domain vault). The anchor line itself
# still runs in Zip with its own seal/secret discipline — this workflow ONLY pings;
# it holds no keys and touches no chains.
#
# Concurrency: the anchor line has its own concurrency group; a missed ping (overlap)
# is harmless — GitHub queues/drops per that group. Hourly cadence ≈ the old weave-heart.
# A ping failure stays visible here (red = the chain needs attention) — fail-honest.

name: weave-anchor-ping

on:
  schedule:
    - cron: '9 * * * *' # hourly, offset from every other cadence in the org
  workflow_dispatch:
    inputs:
      mode:
        description: 'anchor mode forwarded to Zip weave-anchor-lines'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - dry
          - verify-only

permissions:
  contents: read

concurrency:
  group: weave-anchor-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch Zip weave-anchor-lines (PAT from the Domain vault)
        run: |
          MODE="${{ inputs.mode || 'auto' }}"
          CODE=$(curl -s -o /tmp/ping-out.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.ZIP_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/roshpinacare-sys/Zip/actions/workflows/weave-anchor-lines.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"mode\":\"$MODE\"}}")
          echo "dispatch http_code=$CODE mode=$MODE"
          if [ "$CODE" != "204" ]; then
            cat /tmp/ping-out.json
            echo "PING FAILED — the anchor chain is unattended"; exit 1
          fi
