#
#
#

name: dex-watchdog

on:
  schedule:
    # [T36 · WATCHDOG] הערת-הפעימה — הבטחת-הפעלה-מחדש דטרמיניסטית.
    # נמדד-חי (Task 36, trace 1a13ab785610d611): שני-סלוטי-הקרון של dex-beat
    # (:41 ו-:12) לא ירו ב-13:41 וב-14:12 — הפעימה שתקה מאז 13:23:30Z.
    # GitHub מדלג-זימונים-בעומס; שני-חלונות (T25) אינם-תרופה-מספקת.
    # התרופה: שלושה-סלוטים-קלים (בלי-checkout, בלי-bun, בלי-prisma) שמודדים-
    # את-דופק-הפעימה ומעירים-אותה-רק-כשהיא-מבוגרת-מהסף. אידמפוטנטי:
    # ריצה-בעיצומה → לא-מעיר; דופק-טרי (<45 דק') → לא-מעיר; API-לא-זמין →
    # יוצא-בכנות-בכישלון (מקליט, לא-מפעיל-בעיוורון — אותו-חוק-של-guard ה-twin).
    - cron: '5 * * * *'
    - cron: '25 * * * *'
    - cron: '45 * * * *'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: dex-watchdog
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Measure the beat's pulse — wake it only when stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          URL="repos/${GITHUB_REPOSITORY}/actions/workflows/dex-beat.yml/runs?per_page=1"
          LAST=""
          for attempt in 1 2 3; do
            LAST=$(gh api "$URL" --jq '.workflow_runs[0] | {id: .id, created_at: .created_at, status: .status, conclusion: .conclusion}' 2>/dev/null || true)
            if [ -n "$LAST" ] && [ "$LAST" != "{}" ] && [ "$LAST" != "null" ]; then break; fi
            echo "attempt ${attempt}: API unreachable — retrying in 10s"
            sleep 10
          done
          if [ -z "$LAST" ] || [ "$LAST" = "{}" ] || [ "$LAST" = "null" ]; then
            echo "pulse state UNKNOWN (API unreachable after retries) — the watchdog does not dispatch blindly"
            exit 1
          fi
          RID=$(printf '%s' "$LAST" | jq -r '.id // "none"')
          ST=$(printf '%s' "$LAST" | jq -r '.status // "none"')
          AT=$(printf '%s' "$LAST" | jq -r '.created_at // empty')
          if [ "$ST" = "queued" ] || [ "$ST" = "in_progress" ]; then
            echo "alive: the beat is in flight (run ${RID}, status=${ST}) — nothing to wake"
            exit 0
          fi
          if [ -n "$AT" ]; then
            AGE_S=$(( $(date +%s) - $(date -u -d "$AT" +%s) ))
            echo "the beat's last run: ${AT} (run ${RID}, conclusion=$(printf '%s' "$LAST" | jq -r '.conclusion // "none"'), age ${AGE_S}s)"
            if [ "$AGE_S" -lt 2700 ]; then
              echo "alive: the pulse is fresh (45min window) — nothing to wake"
              exit 0
            fi
          else
            echo "no beat run ever recorded — waking the pulse"
          fi
          echo "stale: dispatching dex-beat (the sovereign one-minute-lane self-heals here, git-native — no local supervisor)"
          gh workflow run dex-beat.yml --repo "${GITHUB_REPOSITORY}"
          echo "wake-dispatch accepted — the beat's own run carries the receipts"

  # ── W34 grid-pulse (2026-10-21, roast-grill wave, trace 1a15f522ca6fc8a1) ────────────
  # נמדד-חי: מסילת-החתימה (saos-dex dex-grid.yml, dispatch-only מאז R75) שתקה 10-14→10-21
  # בלי שום-מילה בלוג — התאום-הציבורי לקח-takeover (חוקי), אבל איש לא העיר את המקור החתום,
  # והספר-הציבורי (Console/dex/grid.json) קפא על "ARMED-LIVE" מזויף-טריות במשך 7 ימים.
  # התרופה: אותו-חוק-דופק של dex-beat, למעלה-מסילת-החתימה. סף 6ש' (לא 90דק' של ה-twin):
  # קדנס ה-4×/יום של R16-a נשמר — ה-watchdog מרפא פערים, לא מכפיל קצב.
  # כנות: queued-זומבי (נמדד 10-18, לא-חוסם-סלוט) מזדקן כרגיל ומקבל-הזנקה-טרייה —
  # ההזנקה אינה-חוסמת (הוכח 16:49Z); API-לא-זמין → יציאה-כנה, אף-הזנקה-עיוורת.
  grid-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Measure the signing lane's pulse — wake it only when stale
        env:
          GH_TOKEN: ${{ secrets.ZIP_PAT }}
        run: |
          set -euo pipefail
          URL="repos/roshpinacare-sys/saos-dex/actions/workflows/dex-grid.yml/runs?per_page=1"
          LAST=""
          for attempt in 1 2 3; do
            LAST=$(gh api "$URL" --jq '.workflow_runs[0] | {id: .id, created_at: .created_at, status: .status, conclusion: .conclusion}' 2>/dev/null || true)
            if [ -n "$LAST" ] && [ "$LAST" != "{}" ] && [ "$LAST" != "null" ]; then break; fi
            echo "attempt ${attempt}: API unreachable — retrying in 10s"
            sleep 10
          done
          if [ -z "$LAST" ] || [ "$LAST" = "{}" ] || [ "$LAST" = "null" ]; then
            echo "grid pulse state UNKNOWN (API unreachable after retries) — the watchdog does not dispatch blindly"
            exit 1
          fi
          RID=$(printf '%s' "$LAST" | jq -r '.id // "none"')
          ST=$(printf '%s' "$LAST" | jq -r '.status // "none"')
          AT=$(printf '%s' "$LAST" | jq -r '.created_at // empty')
          if [ -n "$AT" ]; then
            AGE_S=$(( $(date +%s) - $(date -u -d "$AT" +%s) ))
            echo "the signing lane's last run: ${AT} (run ${RID}, status=${ST}, conclusion=$(printf '%s' "$LAST" | jq -r '.conclusion // "none"'), age ${AGE_S}s)"
          else
            echo "no signing-lane run ever recorded — waking the pulse"
            gh workflow run dex-grid.yml --repo roshpinacare-sys/saos-dex
            echo "grid wake-dispatch accepted — the signing lane carries its own receipts"
            exit 0
          fi
          if { [ "$ST" = "queued" ] || [ "$ST" = "in_progress" ]; } && [ "$AGE_S" -lt 3600 ]; then
            echo "alive: the signing lane is in flight (run ${RID}, status=${ST}, age ${AGE_S}s) — nothing to wake"
            exit 0
          fi
          if [ "$AGE_S" -lt 21600 ]; then
            echo "alive: the signing pulse is fresh (6h window, 4x/day doctrine R16-a) — nothing to wake"
            exit 0
          fi
          echo "stale (${AGE_S}s): dispatching saos-dex dex-grid — the signed grid re-arms itself, git-native receipts follow"
          gh workflow run dex-grid.yml --repo roshpinacare-sys/saos-dex
          echo "grid wake-dispatch accepted — honest wake, no blind fire"
