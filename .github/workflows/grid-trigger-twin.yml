#
#
#

name: grid-trigger-twin

on:
  schedule:
    - cron: '27,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grid-trigger-twin
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout the grid home (saos-dex via vault PAT — the twin never forks the book)
        uses: actions/checkout@v5
        with:
          repository: roshpinacare-sys/saos-dex
          ref: main
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 1

      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Shift guard — the sovereign original owns the book while it lives
        id: guard
        env:
          GH_TOKEN: ${{ secrets.ZIP_PAT }}
        run: |
          set -euo pipefail
          URL="repos/roshpinacare-sys/saos-dex/actions/workflows/grid-trigger.yml/runs?per_page=1"
          LAST=""
          for attempt in 1 2; do
            LAST=$(gh api "$URL" --jq '{created_at: .workflow_runs[0].created_at, conclusion: .workflow_runs[0].conclusion}' 2>/dev/null || true)
            if [ -n "$LAST" ] && [ "$LAST" != "{}" ] && [ "$LAST" != "null" ]; then break; fi
            echo "attempt ${attempt}: API unreachable — retrying in 10s"
            sleep 10
          done
          if [ -z "$LAST" ] || [ "$LAST" = "{}" ] || [ "$LAST" = "null" ]; then
            echo "shift state UNKNOWN (API unreachable after retries) — the twin does not take over blindly"
            exit 1
          fi
          AT=$(printf '%s' "$LAST" | jq -r '.created_at // empty')
          CC=$(printf '%s' "$LAST" | jq -r '.conclusion // empty')
          echo "the original's last run: created_at=${AT} conclusion=${CC}"
          if [ "$CC" = "success" ] && [ -n "$AT" ]; then
            AGE_S=$(( $(date +%s) - $(date -u -d "$AT" +%s) ))
            AGE_MIN=$(( AGE_S / 60 ))
            if [ "$AGE_S" -lt 5400 ]; then
              echo "takeover=0" >> "$GITHUB_OUTPUT"
              echo "reason=the original is alive (success ${AGE_MIN} min ago) — the twin verifies only" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "takeover=1" >> "$GITHUB_OUTPUT"
          echo "reason=the original is not healthy (last: ${CC:-unknown}) — the twin takes over the beat" >> "$GITHUB_OUTPUT"

      - name: tick (deterministic grid measurement — the thing-drags-thing pulse)
        if: steps.guard.outputs.takeover == '1' || github.event_name == 'workflow_dispatch'
        run: echo "[T-563 tombstone] grids/run.mjs never lived in this repo (saos-dex-template origin) - step was silent module-not-found under continue-on-error; honest skip"

      - name: peg offer (B-1/B-3 — internal grid params -> external offer)
        if: steps.guard.outputs.takeover == '1' || github.event_name == 'workflow_dispatch'
        run: echo "[T-563 tombstone] grids/peg.mjs never lived in this repo (saos-dex-template origin) - step was silent module-not-found under continue-on-error; honest skip"
        continue-on-error: true

      - name: publish heartbeat back to saos-dex
        if: steps.guard.outputs.takeover == '1' || github.event_name == 'workflow_dispatch'
        run: |
          set -u
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add grids/state/state.json 2>/dev/null || true
          git add grids/state/offer.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no state change — clean exit"
          else
            git commit -m "grid-heartbeat(twin): tick $(date -u +%FT%TZ) [skip ci]"
            for i in 1 2 3; do
              if git push origin main; then echo "heartbeat published (attempt $i)"; exit 0; fi
              git pull --rebase -X theirs --autostash -q origin main || true
              sleep $((i * 5))
            done
            echo "push failed after retries — honest failure"; exit 1
          fi

      - name: Verify-only (this shift belongs to the living original)
        if: steps.guard.outputs.takeover != '1' && github.event_name != 'workflow_dispatch'
        run: |
          echo "${{ steps.guard.outputs.reason }}"
          echo "The twin takes over automatically when the original's last success ages past 90 min."
          echo "Nothing was touched — one home, one book, one chain."

      # ── W36 signing-lane pulse (measurement plane 3, roast-grill lineage) ──
      # נמדד-חי 22:47→23:45Z: סלוטי-הקרון של dex-watchdog דולגו על-ידי GitHub —
      # מסילת-החתימה התיישנה מעבר לחלון-ה-6h בזמן שכל-המודדים דיווחו "success".
      # החוק: אף-עורק לא נמדד-ממקור-אחד. שלושה-מישורים (watchdog :05/:25/:45 ·
      # grid-doctor :19 · כאן :27/:57) — דילול-מקביל-בכל-השעות הוא בלתי-סביר.
      - name: W36 signing-lane pulse (plane 3 — dilution-proof by diversity)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ZIP_PAT }}
        run: |
          set -euo pipefail
          URL="repos/roshpinacare-sys/saos-dex/actions/workflows/dex-grid.yml/runs?per_page=1"
          LAST=$(gh api "$URL" --jq '.workflow_runs[0] | {created_at: .created_at, status: .status}' 2>/dev/null || true)
          if [ -z "$LAST" ] || [ "$LAST" = "null" ]; then
            echo "signing pulse UNKNOWN (API unreachable) — fail-honest, no blind fire"; exit 0
          fi
          AT=$(printf '%s' "$LAST" | jq -r '.created_at // empty')
          ST=$(printf '%s' "$LAST" | jq -r '.status // "none"')
          if [ -n "$AT" ]; then
            AGE_S=$(( $(date +%s) - $(date -u -d "$AT" +%s) ))
            echo "signing lane: ${AT} (status=${ST}, age ${AGE_S}s)"
            [ "$ST" = "in_progress" ] && { echo "alive: in flight — nothing to wake"; exit 0; }
            if [ "$AGE_S" -lt 21600 ]; then echo "alive: fresh (6h window, R16-a) — nothing to wake"; exit 0; fi
          fi
          echo "stale: waking saos-dex dex-grid (measurement plane 3)"
          gh workflow run dex-grid.yml --repo roshpinacare-sys/saos-dex
          echo "grid wake-dispatch accepted — honest wake, no blind fire"
