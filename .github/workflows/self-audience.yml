# SAOS SELF-AUDIENCE on Domain (public repo — free Actions, no minutes quota) — Z-20
#
# למה-כאן: הריפו-הפרטי (steem) אזל-מינוטים-פרטיים (מכסה-חודשית, חזרה 10-01).
# הרכבת-הריבונית עוברת לרכבת-הציבורית: אותו-צינור, מפתחות-דרך-סודות-ריפו
# (אותה-דוקטרינה כמו EVM_ANCHOR_PK), סורגי-בייטים לפני-כל-חתימה.
#
# צינור מלא (fail-soft — סוכן לעולם לא מפיל-את-הרכבת):
#   1. soldiers-blog — רוטציית 10 חיילים · תוכן נתוני-אמת (מדידה-חיה לפני-פרסום)
#   2. fleet-claim   — הצי תובע את פרסי-עצמו (posting-only, אידמפוטנטי, גילגול)
#   3. head-delegate — תחזוקת-הון-עצמית: 30 SP לכל-חייל (אידמפוטנטי)
#   4. self-audience — הצבעה-צולבת (לא-עצמית) · שערי VP/RC · verify-then-sign
#   5. fleet-doctor  — אבחון-עצמי נטול-מפתחות · STATE-REPORT יומי
#
# סודות: SA_FLEET_KEYS (בסיס64 של מפת-posting-WIFs ×11) · SA_HEAD_ACTIVE (בסיס64)
# אפס-סודות-בפלט/בקבלות/בקומיטים. קבלות-נטולות-סודות בלבד.

name: self-audience

on:
  schedule:
    - cron: '30 14 * * *'   # 14:30 UTC
  workflow_dispatch:
    inputs:
      skip_posts:
        description: 'skip soldiers-blog (votes only)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

concurrency:
  group: self-audience
  cancel-in-progress: false

jobs:
  sovereign-audience:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_PATH: /tmp/steemjs/node_modules
    steps:
      - name: STASIS gate (mechanical, FATE-DEFENSE law #1 — Z-71 deep-audit F7)
        id: brake
        run: |
          if [ -f agents/STASIS.json ]; then
            ST=$(node -p "JSON.parse(require('fs').readFileSync('agents/STASIS.json','utf8')).active===true")
          else
            ST=false
          fi
          echo "active=$ST" >> "$GITHUB_OUTPUT"
          if [ "$ST" = "true" ]; then
            echo "STASIS-HALT self-audience (claims-adjacent) · the breaker is active — capital lanes obey"
          fi
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: steem client (steem@0.7.11 — home template)
        run: |
          npm install --prefix /tmp/steemjs steem@0.7.11 --omit=dev --no-audit --no-fund --loglevel=error
          NODE_PATH=/tmp/steemjs/node_modules node -e "require('steem'); console.log('steem-js OK via NODE_PATH')"

      - name: soldiers publish (rotation, measured-truth content)
        if: ${{ github.event.inputs.skip_posts != 'true' }}
        env:
          SA_FLEET_KEYS: ${{ secrets.SA_FLEET_KEYS }}
          RECEIPT_OUT: agents/receipts/soldiers-blog-receipt.json
        run: node agents/soldiers-blog.cjs

      - name: fleet claims its own rewards (self-economy)
        env:
          SA_FLEET_KEYS: ${{ secrets.SA_FLEET_KEYS }}
          RECEIPT_OUT: agents/receipts/fleet-claim-receipt.json
        run: node agents/fleet-claim.cjs

      - name: head delegation maintenance (self-capital, idempotent)
        env:
          SA_HEAD_ACTIVE: ${{ secrets.SA_HEAD_ACTIVE }}
          RECEIPT_OUT: agents/receipts/head-delegate-receipt.json
        run: node agents/head-delegate.cjs

      - name: cross-vote sweep (verify-then-sign, read-back)
        env:
          SA_FLEET_KEYS: ${{ secrets.SA_FLEET_KEYS }}
          RECEIPT_OUT: agents/receipts/self-audience-receipt.json
        run: node agents/self-audience.cjs

      - name: fleet social (substantive comments + follow-graph + reblog — mutual support)
        env:
          SA_FLEET_KEYS: ${{ secrets.SA_FLEET_KEYS }}
          RECEIPT_OUT: agents/receipts/fleet-social-receipt.json
        run: node agents/fleet-social.cjs

      - name: learning loop (external engagement ledger — keyless)
        run: node agents/measure-learn.cjs

      - name: fleet doctor (keyless self-diagnosis)
        run: node agents/fleet-doctor.cjs

      # R22 (CR-0052) root-cause fix, measured from run 37144830642's log: the desk measured
      # fine, committed 9 files (3181 insertions) — and DIED at push, 3 scheduled runs in a
      # row. Chain: the add list MISSED files the measure steps wrote (left unstaged) →
      # `git pull --rebase` refused ("You have unstaged changes"), the `|| true` swallowed
      # it, then `git push` hit the remote-move race and failed. The receipts of a full day
      # were written and then thrown away, daily. Fix: stage the whole measured surface
      # (git add -A), rebase WITH autoStash, and the house 3-attempt retry idiom (same as
      # twin-audit's publish loop).
      - name: commit receipts (secretless)
        run: |
          git config user.name "saos-self-audience"
          git config user.email "self-audience@saos.local"
          mkdir -p agents/receipts
          git add -A
          if git diff --cached --quiet; then
            echo "no receipt changes"
          else
            git commit -m "self-audience: daily receipts + state-report · $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"

            ok=0
            for attempt in 1 2 3; do
              if git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main; then
                echo "receipts published (attempt ${attempt})"; ok=1; break
              fi
              echo "publish failed (attempt ${attempt})"
              sleep 5
            done
            [ "$ok" = "1" ] || { echo "could not publish receipts after 3 attempts - fail-loud, the measurements will not be silently dropped"; exit 1; }
          fi
