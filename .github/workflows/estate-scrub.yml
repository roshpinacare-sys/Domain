# estate-scrub — self-healing exposure guard for Domain (19-a).
# Parallel engine runs regenerate books on Actions; until every generator is
# audited for refs-scrub-at-write, this sweep scrubs any estate-name emission
# within 15 minutes of publish. The gate (exposure-gate.yml) stays the law.
name: estate-scrub

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estate-scrub
  cancel-in-progress: false

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scrub + verify
        env:
          FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }}
        run: node scripts/estate-scrub.mjs
      - name: Commit healed books
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "estate-scrub: refs re-applied to regenerated books · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs --autostash --autostash origin main && git push && break || sleep 5; done
          else
            echo "tree already clean"
          fi
