#
#

name: treasury-route

on:
  push:
    branches: [main]
    paths:
      - 'agents/treasury-desk.cjs'
      - 'agents/route-desk.cjs'
      - 'agents/capability-matrix.cjs'
      - 'agents/dex-book.cjs'
      - 'agents/bridge-desk.cjs'
      - 'agents/blurt-curate.cjs'
      - '.github/workflows/treasury-route.yml'
  schedule:
    # R78 (owner trace 1a15f4a1e42c9839): daily cadence left the public capital book 20h+ stale —
    # the same class 19.53 cured for the weave mirror. 4h cadence = the book measures 6×/day.
    # Signing VOLUME stays daily: the desk self-gates (treasury-desk.cjs R78 signing gate, ≥20h gap)
    # and the blurt step carries its own receipt-age gate below. Zero new signing risk.
    - cron: '37 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: treasury-route
  cancel-in-progress: false

jobs:
  treasury:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_PATH: /tmp/steemjs/node_modules
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # R78 brake repair — measured defects in the old placement: the gate ran BEFORE checkout
      # (agents/STASIS.json never existed on the runner → the printed token was always "false"),
      # the wrapper's missing-file branch overrode the gate's own fail-closed contract, and NO step
      # consumed the token — the brake was decorative. Now: gate runs post-checkout, the gate's
      # fail-closed semantics are untouched (unreadable file → prints true), and the token STOPS the job.
      - name: STASIS gate (mechanical, FATE-DEFENSE law — fail-closed at the source)
        id: brake
        run: |
          ST=$(node agents/stasis-gate.cjs general)
          echo "active=$ST" >> "$GITHUB_OUTPUT"
      - name: STASIS halt (the breaker obeys — capital lanes stop before any signing)
        if: steps.brake.outputs.active == 'true'
        run: |
          echo "STASIS-HALT treasury-route · the breaker is active — capital lanes obey"
          exit 1

      - name: checkout private steem home (vault recovery source — proven Z-21 pattern)
        uses: actions/checkout@v5
        with:
          repository: roshpinacare-sys/steem
          token: ${{ secrets.WEAVE_OPS_PAT }}
          fetch-depth: 1
          path: steem-repo

      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: steem client (steem@0.7.11 — same signer as the fleet)
        run: |
          npm install --prefix /tmp/steemjs steem@0.7.11 --omit=dev --no-audit --no-fund --loglevel=error
          NODE_PATH=/tmp/steemjs/node_modules node -e "require('steem'); console.log('steem-js OK')"

      - name: treasury desk (book + claims + head curation)
        env:
          SA_FLEET_KEYS: ${{ secrets.SA_FLEET_KEYS }}
          SA_HEAD_POSTING: ${{ secrets.SA_HEAD_POSTING }}
          STEEM_REPO_DIR: steem-repo
          RECEIPT_OUT: agents/receipts/treasury-desk-receipt.json
          FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }}
        run: node agents/treasury-desk.cjs

      - name: route desk (oracles + HE book + bridge probes)
        env:
          ROUTES_JSON: agents/routes.json
        run: node agents/route-desk.cjs

      - name: capability matrix (usage verification book, read-only)
        env:
          SA_FLEET_KEYS: ${{ secrets.SA_FLEET_KEYS }}
          SA_HEAD_POSTING: ${{ secrets.SA_HEAD_POSTING }}
          STEEM_REPO_DIR: steem-repo
          FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }}
        run: node agents/capability-matrix.cjs

      - name: dex depth book (steem orderbook + HE depth, read-only)
        run: node agents/dex-book.cjs

      - name: bridge desk (no-account exchanger sweep, read-only)
        run: node agents/bridge-desk.cjs

      - name: blurt daily gate (R78 — book refreshes 6×/day, vote VOLUME stays daily)
        id: blurtgate
        run: |
          DUE=true
          if [ -f agents/receipts/blurt-curate-receipt.json ]; then
            A=$(node -e "try{const r=require('./agents/receipts/blurt-curate-receipt.json');const h=(Date.now()-Date.parse(r.at||0))/36e5;console.log(isFinite(h)&&h<20?'skip':'run')}catch(e){console.log('run')}")
            [ "$A" = "skip" ] && DUE=false
          fi
          echo "due=$DUE" >> "$GITHUB_OUTPUT"
          echo "blurt daily gate: due=$DUE"

      - name: blurt curation (idle 8,727 BP activation, VP-gated, verify-then-sign)
        if: steps.blurtgate.outputs.due == 'true'
        env:
          SA_FLEET_KEYS: ${{ secrets.SA_FLEET_KEYS }}
          SA_HEAD_POSTING: ${{ secrets.SA_HEAD_POSTING }}
          STEEM_REPO_DIR: steem-repo
          RECEIPT_OUT: agents/receipts/blurt-curate-receipt.json
        run: node agents/blurt-curate.cjs

      # self-heal BEFORE the gate: the lane's own producers may emit raw names —
      # measured 2026-10-13: the gate blocked a full run because a producer's fresh
      # output carried them. Redaction now runs pre-gate; the gate still fails loud
      # if redaction left anything raw.
      - name: redact telemetry (pre-gate self-heal)
        run: |
          node agents/redact-telemetry.mjs agents/money-ledger.json agents/dex-book.json agents/bridge-book.json agents/capability-matrix.json agents/receipts/treasury-desk-receipt.json agents/receipts/blurt-curate-receipt.json || true

      - name: exposure gate (fail-loud — raw names never publish)
        run: node scripts/exposure-scan.mjs

      - name: commit ledger + routes + receipts (secretless)
        continue-on-error: true
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          mkdir -p agents/receipts
          node agents/redact-telemetry.mjs agents/money-ledger.json agents/dex-book.json agents/bridge-book.json agents/capability-matrix.json agents/receipts/treasury-desk-receipt.json agents/receipts/blurt-curate-receipt.json || true
          for p in agents/money-ledger.json agents/routes.json agents/routes.md agents/receipts/treasury-desk-receipt.json agents/capability-matrix.json agents/capability-matrix.md agents/dex-book.json agents/dex-book.md agents/bridge-book.json agents/bridge-book.md agents/receipts/blurt-curate-receipt.json; do
            [ -e "$p" ] && git add "$p" || true
          done
          if git diff --cached --quiet; then
            echo "no ledger changes"
          else
            git commit -m "treasury-route: capital book + router mirror · $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            ok=0
            for i in 1 2 3; do
              if git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
              echo "push attempt $i failed (concurrent commits on main) — re-pulling"
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            [ "$ok" = "1" ] && echo "books pushed" || echo "books landed locally; next run re-attempts (fail-soft)"
          fi
