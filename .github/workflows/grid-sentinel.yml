name: grid-sentinel
# המשגיח-על-המשגיחים — owner trace 1a1319b2 ("הכל מרגיש שקט").
# כל 20 דקות: מודד את כל הצי (ריפואים × עורקים × ריצות), מפרסם מטריצה חיה
# (status.json + GRID-STATUS.md → Pages) ואוכף-חיים:
#   T1 מעיר workflows שנוטרלו בחוק-60-הימים (disabled_inactivity)
#   T2 מצית עורקי-פעימה ציבוריים ששתקו >3ש (cap 5)
#   T3 issue-GRID-SILENCE אידמפוטנטי אחד — רק על שקט-ציבורי (פרטי-QUOTA-DEAD
#      נמדד אך לא מוזעק — החיים-המתוכננים שלו חיים על דקות-ציבור, R244).
# דקות-ציבוריות בלבד · אפס-סוד-מודפס · אפס-תלות-בסנדבוקס.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: grid-sentinel
  cancel-in-progress: false
jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: measure the whole grid + enforce aliveness
        env:
          MAIN_KEY: ${{ secrets.MAIN_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ZIP_PAT: ${{ secrets.ZIP_PAT }}
        run: node agents/grid-sentinel.mjs
      - name: publish grid truth (matrix + status.json + GRID-STATUS.md)
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add agents/grid-matrix.json status.json GRID-STATUS.md
          if git diff --cached --quiet; then echo "no grid changes"; else
            for i in 1 2 3; do
              git -c rebase.autoStash=true pull --rebase origin main >/dev/null 2>&1 || true
              git commit -m "grid-sentinel: live grid matrix + aliveness enforcement $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]" >/dev/null 2>&1 && break || sleep 5
            done
            bash scripts/safe-push.sh
          fi
      # pulse — הרשת נושאת את השעון של עצמה (דפוס R280: המתזמן של GitHub מדלל
      # קדנסים תדירים — נמדד 30ד→7.5ש). אחרי כל ריצה (גם-כשל), פעימה ממתינה
      # 13 דקות ומציתה את הסריקה הבאה בעצמה → קצב קבוע ~17ד, בלי-תלות במתזמן.
      # ה-cron נשאר כגיבוי-ריפוי-עצמי אם השרשרת מתה.
      - name: pulse — carry the clock (scheduler-dilution counter, R280 pattern)
        if: always()
        env:
          PULSE_TOKEN: ${{ secrets.ZIP_PAT }}
        run: |
          sleep 780
          for i in 1 2 3; do
            code=$(curl -s -X POST \
              -H "Authorization: token ${PULSE_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/grid-sentinel.yml/dispatches" \
              -d '{"ref":"main"}' -o /dev/null -w '%{http_code}') || code=000
            [ "${code}" = "204" ] && { echo "pulse: next heartbeat dispatched (HTTP 204)"; break; }
            echo "pulse attempt ${i}: HTTP ${code}"; sleep 10
          done
          echo "pulse done"
