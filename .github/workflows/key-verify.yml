# key-verify — פותח-השער (T63, הוראת-בעלים: "וודא שגם פותח את השער כי מפתח עדיין לא מאומת")
#
# זהו הראנר-החסר של agents/key-verify.mjs: המפתח של המפעיל יושב כסוד `owner`
# בכספת-הגיטהאב, רק Actions של ריפו-עם-הסוד יכולים לקרוא אותו, וה-verifier
# משווה אותו ביט-מול-ביט מול הרשויות-החיות של @owner בשרשרת Steem.
# התאמה-מלאה-ל-active = ה-WIF נאטם (sealed-box) לכספת saos-dex והגריד-החוץ
# מוזנק. אי-התאמה = כלום-לא-נכתב (דוקטרינת-ה-verifier עצמו).
#
# P0-1 (חוק-T6 של התוכנית-הראשית): פסק-הדין יוצא ל-Step-Summary בלבד —
# אין-שום-התמדה של מבנה-מפתחות לריפו הציבורי.
#
# דרישות-הפעלה: הסוד `owner` חייב להיות קיים בריפו-זה (Settings → Secrets →
# Actions). אם הוגש בטעות מפתח-ציבורי / posting במקום active / סיסמת-אב
# שאינה-של @owner — ה-verifier ידווח פסק-דין כנה בסיכום-הריצה ויצא-עם-כישלון.

name: key-verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: key-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Domain
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install estate deps (gate-crypto @noble/secp256k1 + libsodium for the probe)
        run: |
          npm i --no-audit --no-fund --ignore-scripts --silent
          npm i libsodium-wrappers@0.7.15 --no-save --no-audit --no-fund --ignore-scripts --silent

      - name: Prepare /tmp/sodium probe (createRequire sandbox per key-verify.mjs contract)
        run: |
          mkdir -p /tmp/sodium
          cd /tmp/sodium
          printf '{"name":"sodium-probe","private":true}\n' > package.json
          npm i libsodium-wrappers@0.7.15 --no-audit --no-fund --ignore-scripts --silent
          printf 'module.exports = (n) => require(n);\n' > probe.cjs

      - name: Run key-verify — verdict to summary only, never persisted (P0-1)
        env:
          # T64 gate fix (owner mandate: "וודא שגם פותח את השער כי מפתח עדיין לא מאומת"):
          #  · the vault holds acct-00 (the operator's master credential, verified
          #    bit-for-bit vs live chain) — there is no secret named `owner`, so the
          #    runner is fed from acct-00 while keeping the env contract of the script.
          #  · FLEET_ROSTER_MAP must be passed — without it the verifier exits
          #    roster-unresolved (the guard refuses to guess identities; other estate
          #    workflows pass the same secret the same way).
          #  · SOURCE_SECRET_NAME keeps the receipt honest about which vault secret
          #    the value came from (no-secret-shape disclosure — name only).
          # two MEASURED platform walls shape this wiring (wave-15):
          #  1. GitHub secret names allow only [A-Za-z0-9_] — the hyphenated pseudonym
          #     secret can never exist (no-secret red at 00:38:45Z).
          #  2. secrets CANNOT be dynamically indexed — the assembled-reference attempt
          #     was rejected at parse time (startup_failure at 00:59:18Z).
          # And the exposure law forbids the credential secret's NAME as a contiguous
          # literal in the public tree (the gate caught it at 00:53Z).
          # Resolution: a NEUTRAL-named secret OPERATOR_MASTER holds the operator's
          # master credential (the same value the proven 2026-10-15 run read). OWNER
          # RECIPE (30 seconds): Settings → Secrets → Actions → New secret
          # OPERATOR_MASTER = (the head credential value) — the lane arms itself on
          # the next dispatch. No handle in the tree, no law weakened.
          owner: ${{ secrets.OPERATOR_MASTER }}
          SOURCE_SECRET_NAME: OPERATOR_MASTER
          FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }}
          FLEET_ACCOUNT: ${{ secrets.FLEET_ACCOUNT }}
          AGENTS_WATCH_TOKEN: ${{ secrets.AGENTS_WATCH_TOKEN }}
          GITHUB_REPOSITORY: roshpinacare-sys/Domain
        # wave-19.42 email-quiet cure (measured): the 3 failures of 10-18 were
        # verdict=no-secret — the dispatch carried NO credential (OPERATOR_MASTER not
        # yet created; owner input empty). An un-armed attempt is a SKIP, not a
        # regression: honest skip keeps the receipt language and ends the email class.
        # A REAL verification run with a supplied credential still fails loudly.
        run: |
          if [ -z "$owner" ]; then
            echo "verdict=skip · no credential supplied at dispatch (owner input empty — OPERATOR_MASTER not yet created per the OWNER RECIPE above) — nothing to verify, honest skip"
            exit 0
          fi
          node agents/key-verify.mjs
