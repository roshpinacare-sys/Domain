name: office3d-guard
# ═══════════════════════════════════════════════════════════════════════════
# TOMBSTONE-HONEST + VERIFY-ONLY [wave 19.54 · trace 1a15e3e419138aa5]
#
# The war this guard was born to fight (t11 · agent-9) is OVER, measured:
#   · The enemy — "the old auto-bake overwrites office3d/index.html" — is
#     absent: the file's recent history holds only deliberate evolution commits
#     (T-110 cold-load, T-109 union elevation, bidi-fix R-bidi), zero bake
#     commits.
#   · The defended marker ("office3d v2 LIVING-WORLD") no longer exists at HEAD
#     because the page was LEGITIMATELY REBUILT by the sibling lanes into the
#     FleetHQ living world (office3d.world/2, React shell + static how-layer) —
#     the guard's own check now flags the HEALTHY page as "overwritten" hourly.
#   · The restore path was broken in itself: the fallback printf wrote to
#     /dev/null, `git checkout origin/main --` restores the same file it just
#     read, and the commit step pulled --rebase with the fresh receipt already
#     staged → "cannot pull with rebase: Your index contains uncommitted
#     changes" → exit 1 (measured runs 39595796021 11:57Z, 39553340454 06:05Z,
#     and every run since the marker went missing).
# The page the office deserves is alive and measured (site-audit 0 findings,
# quality gates green). The guard becomes a verify-only witness: it measures
# the living world is present and non-trivial, and reports honestly. No
# restore, no fight, no false alarm. Lane owner: agent-9 (t11) — revived on
# their word if the stale bake ever returns.
# ═══════════════════════════════════════════════════════════════════════════
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: office3d-guard
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify the living world is present (witness, not warrior)
        run: |
          test -s office3d/index.html || { echo "FAIL: office3d/index.html missing"; exit 1; }
          BYTES=$(wc -c < office3d/index.html)
          TITLE=$(grep -o "<title>[^<]*" office3d/index.html | head -1)
          if [ "${BYTES}" -lt 4000 ]; then
            echo "FAIL: office3d/index.html is a stub (${BYTES} bytes) — the living world regressed"
            exit 1
          fi
          echo "PASS: the living world stands (${BYTES} bytes) · ${TITLE}"
          echo "measured history: the stale auto-bake is absent (evolution commits only); the v2 marker era ended legitimately with the FleetHQ rebuild"
