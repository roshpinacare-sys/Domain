# ── הקנרית של הצייד (R82 → Domain 2026-10-06) ───────────────────────
# העברה מ-Defi (פרטי — חנקת-מכסה, בלי billing) ל-Domain הציבורי:
# Actions על ריפוא ציבוריים = חינם ללא הגבלה, השער לא יכול למות.
# בדיקת-שער מינימלית: עבודה של שניות. הצייד (mini-services/hunter)
# משגר אותה כל 6 שעות ומדווח בכנות.
name: canary
on:
  workflow_dispatch: {}
jobs:
  chirp:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "canary alive $(date -u +%Y-%m-%dT%H:%M:%SZ)"
