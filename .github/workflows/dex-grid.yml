#
#
# [zai-18] 2026-10-12 — מצב-חי מדוד (מעודכן; מחליף את כנות-AMBER של 13a מ-10-11):
# שער-G1 נפתח — מפתח-הבעלים אומת מול-רשויות-החיות (keyGate ok:true, authorityOk:true
# ב-run 38243950935) והגריד ARMED-LIVE: מחזורי-רענון חיים על-הספר-הפנימי (סוויפ-זומבים
# ואז-סולם-maker סביב-קו-הזהות) — תקופה-ראשונה-מאז-רוטציית-10-08.
# ההיגיון-לא-השתנה: maker-only סביב-קו-הזהות-החיצוני (לעולם-לא מוכרים-מתחת-לערך-החיצוני,
# קונים-רק-מתחתיו), הבלם-בזמן-חתימה (brake.mjs), תקרות-בקוד. אל-תגעו בהיגיון-החתימה (חוק-ברזל).
# חוסן: המקור-הפרטי (saos-dex) מת על-מכסת-minutes — התאום-הזה-הוא המכונה (guard-למטה
# קובע-takeover לפי-בריאות-המקור; schedule 4×/יום רץ-כאן-על-דקות-פומביות).
#
name: dex-grid

on:
  schedule:
    # R16-a (2026-10-12, owner mandate trace 1a1…ff11 "תצית תפעיל שלא יהיו חסימות"):
    # cadence 1→4×/day — 14-a measured 11 stale resting asks behind the market after the
    # daily-only refresh; the grid re-arms around the live book 4×/day now (maker-only,
    # brake + key-gate re-checked at every sign). Minutes: :26 slot kept (minute-map free).
    - cron: "26 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dex-grid-domain-twin
  cancel-in-progress: false

jobs:
  grid:
    runs-on: ubuntu-latest
    # N8-g (2026-10-22, owner trace 1a16429cb29ef8d1 "טפל במה שפתוח" + 27 "חייב מילוי חוץ"):
    # the pulse step sleeps 840s inside the run → the run must outlive it (measured 22m
    # envelope in grid-sentinel with sleep 780).
    timeout-minutes: 25
    steps:
      - name: Checkout the sovereign chain home
        uses: actions/checkout@v5
        with:
          repository: roshpinacare-sys/saos-dex
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 1

      - name: STASIS gate (mechanical, FATE-DEFENSE law
        id: brake
        run: |
          set -eu
          S=$(node -e "const s=JSON.parse(require('fs').readFileSync('grids/state/STASIS.json','utf8'));console.log([s.active===true?'true':'false',String(s.mode||'full'),(Array.isArray(s.stagedLanes&&s.stagedLanes.allow)&&s.stagedLanes.allow.map(String).map(x=>x.toLowerCase()).includes('grid'))?'true':'false'].join(' '))")
          ACTIVE=$(echo "$S" | cut -d' ' -f1); MODE=$(echo "$S" | cut -d' ' -f2); LANE_OK=$(echo "$S" | cut -d' ' -f3)
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "lane_allowed=$LANE_OK" >> "$GITHUB_OUTPUT"
          if [ "$ACTIVE" = "true" ] && [ "$MODE" = "staged" ] && [ "$LANE_OK" = "true" ]; then
            echo "[CAPITAL-GATE] STASIS-STAGED-ALLOW dex-grid twin (lane=grid) · owner directive 2026-10-05 trace 1a1…2391 — staged grid lane open in the saos-dex home; the in-code brake (grids/brake.mjs) re-checks at sign-time"
          elif [ "$ACTIVE" = "true" ]; then
            echo "STASIS-HALT dex-grid twin (lane=grid) · the breaker is active (mode=$MODE) — capital lanes obey (limit orders + community leg)"
          else
            echo "STASIS-LIFTED dex-grid twin · active=false — full operation (master flag)"
          fi

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-dex-${{ hashFiles('bun.lock') }}
          restore-keys: bun-dex-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Prisma client
        run: bunx prisma generate

      - name: Refuse honestly while the active key awaits the operator
        env:
          KEY: ${{ secrets.STEEM_ACTIVE_WIF }}
        run: |
          if [ -z "$KEY" ]; then
            echo "STEEM_ACTIVE_WIF is not set in this repository's vault (Settings > Secrets and variables > Actions)."
            echo "The grid signs every external order with the active key of @owner — without it there is"
            echo "no placement at all. And running grid-beat keyless would publish a false DISARMED-NO-KEY"
            echo "verdict while the true state is armed (the key lives in the private saos-dex vault,"
            echo "which secrets never cross). The machine refuses honestly, touching nothing, until the"
            echo "operator delivers the key — the same key that armed the grid in the first place."
            echo "See README - the machine twin."
            exit 1
          fi

      - name: Shift guard — the sovereign original owns the grid while it lives
        id: guard
        env:
          GH_TOKEN: ${{ secrets.ZIP_PAT }}
        run: |
          set -euo pipefail
          URL="repos/roshpinacare-sys/saos-dex/actions/workflows/dex-grid.yml/runs?per_page=1"
          LAST=""
          for attempt in 1 2; do
            LAST=$(gh api "$URL" --jq '{created_at: .workflow_runs[0].created_at, conclusion: .workflow_runs[0].conclusion}' 2>/dev/null || true)
            if [ -n "$LAST" ] && [ "$LAST" != "{}" ] && [ "$LAST" != "null" ]; then break; fi
            echo "attempt ${attempt}: API unreachable — retrying in 10s"
            sleep 10
          done
          if [ -z "$LAST" ] || [ "$LAST" = "{}" ] || [ "$LAST" = "null" ]; then
            echo "shift state UNKNOWN (API unreachable after retries) — the twin does not take over blindly"
            exit 1
          fi
          AT=$(printf '%s' "$LAST" | jq -r '.created_at // empty')
          CC=$(printf '%s' "$LAST" | jq -r '.conclusion // empty')
          echo "the original's last run: created_at=${AT} conclusion=${CC}"
          if [ "$CC" = "success" ] && [ -n "$AT" ]; then
            AGE_S=$(( $(date +%s) - $(date -u -d "$AT" +%s) ))
            AGE_H=$(( AGE_S / 3600 ))
            echo "the original's last success: ${AGE_H}h ago"
            # N8-g shift law: the measured war left the value shelf naked for hours between
            # manual dispatches (out-of-repo churner cancels it within minutes; the original
            # has no schedule — private minutes quota). The twin on PUBLIC minutes now takes
            # the routine shift when the original's success ages past 2h; manual dispatch of
            # the original always overrides (commander law unchanged).
            if [ "$AGE_S" -lt 7200 ]; then
              echo "takeover=0" >> "$GITHUB_OUTPUT"
              echo "reason=the original is alive (success ${AGE_H}h ago) — the twin verifies only" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "takeover=1" >> "$GITHUB_OUTPUT"
          echo "reason=the original is not healthy (last: ${CC:-unknown}) — the twin takes over the grid" >> "$GITHUB_OUTPUT"

      - name: Grid (read the live book, mark to live feeds, place if armed, publish)
        if: (steps.brake.outputs.active != 'true' || steps.brake.outputs.lane_allowed == 'true') && (steps.guard.outputs.takeover == '1' || github.event_name == 'workflow_dispatch')
        run: bun run grid-beat.ts
        env:
          SAOS_RELAY_AGENT_ACCOUNT: ${{ secrets.FLEET_ACCOUNT }}
          STEEM_ACTIVE_WIF: ${{ secrets.STEEM_ACTIVE_WIF }}
          HIVE_ACTIVE_WIF: ${{ secrets.HIVE_ACTIVE_WIF }}
          CONSOLE_TOKEN: ${{ secrets.WEAVE_OPS_PAT }}

      - name: Verify-only (this shift belongs to the living original)
        if: steps.guard.outputs.takeover != '1' && github.event_name != 'workflow_dispatch'
        run: |
          echo "${{ steps.guard.outputs.reason }}"
          echo "The twin takes over automatically when the original's last success ages past 2h (N8-g cadence law)."
          echo "Nothing was touched — one home, one grid, one book."

      # halted under mode=staged exactly as the owner ordered; only a FULL lift (active=false)
      - name: Community leg (owner-mandated Steem community — D-024, fail-closed)
        if: always() && steps.brake.outputs.active == 'false'
        env:
          SAOS_RELAY_AGENT_ACCOUNT: ${{ secrets.FLEET_ACCOUNT }}
          STEEM_ACTIVE_WIF: ${{ secrets.STEEM_ACTIVE_WIF }}
        run: echo "[T-563 tombstone] grids/community.mjs never lived in this repo (saos-dex-template origin) - step was silent module-not-found under continue-on-error; honest skip"
        continue-on-error: true

      - name: Community evidence commit (receipt = commit)
        if: always()
        run: |
          set -u
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add grids/state/community-plan.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no community evidence change — clean exit"
          else
            git commit -m "community-leg: owner-mandated Steem community evidence $(date -u +%FT%TZ) [skip ci]"
            git pull --rebase -X theirs --autostash origin main
            bash scripts/safe-push.sh
          fi


      - name: Delegation leg (owner-mandated SP deployment — staged lane, in-code brake re-checks)
        if: always()
        env:
          SAOS_RELAY_AGENT_ACCOUNT: ${{ secrets.FLEET_ACCOUNT }}
          STEEM_ACTIVE_WIF: ${{ secrets.STEEM_ACTIVE_WIF }}
        run: echo "[T-563 tombstone] grids/delegate-plan.mjs never lived in this repo (saos-dex-template origin) - step was silent module-not-found under continue-on-error; honest skip"
        continue-on-error: true

      - name: Delegation evidence commit (receipt = commit)
        if: always()
        run: |
          set -u
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add grids/state/delegation-receipt.jsonl grids/state/events.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no delegation evidence change — clean exit"
          else
            git commit -m "delegations: owner-mandated SP deployment receipt $(date -u +%FT%TZ) [skip ci]"
            git pull --rebase -X theirs --autostash origin main
            bash scripts/safe-push.sh
          fi

      # pulse — the network carries its own clock (R280 pattern, measured 30m→7.5h dilution
      # on the GitHub scheduler). After every run (even failure), wait ~14 minutes and
      # ignite the next scan itself → steady ~19min cadence on PUBLIC minutes; the hourly
      # cron stays as self-heal backup if the pulse chain dies. N8-g: the value shelf can
      # no longer stand naked for hours after the churner's cancels — re-armed within ~20
      # minutes, preserve-conforming law keeps the two homes one book.
      - name: pulse — carry the clock (scheduler-dilution counter, R280 pattern)
        if: always()
        env:
          PULSE_TOKEN: ${{ secrets.ZIP_PAT }}
        run: |
          sleep 840
          code="failed"
          for i in 1 2 3; do
            code=$(curl -s -X POST \
              -H "Authorization: token ${PULSE_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/roshpinacare-sys/Domain/actions/workflows/dex-grid.yml/dispatches" \
              -d '{"ref":"main"}' -o /dev/null -w '%{http_code}')
            [ "$code" = "204" ] && break || sleep 10
          done
          echo "self-pulse dispatch: ${code}"
