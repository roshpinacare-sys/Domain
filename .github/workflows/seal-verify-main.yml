#
# seal-verify-main — פסק-דין-קריאה-בלבד (cron-watchdog 503815, 2026-11-05)
#
# השאלה הנמדדת: האם הסוד MAIN (המפתח שהמפעיל הניח, נוצר 2026-11-04T22:01:33Z
# בכספת-Domain) פותח את החותם החי sovereign/weave-seal.enc בבית-הריבוני Zip?
# והאם הוא זהה-ביט-מול-ביט לסוד MAIN_KEY שממנו אומצה סיסמת-החותם
# (seal-adopt run#21 · Zip commit f42cbda0f53e · 2026-11-04T22:09:30Z)?
#
# אפס-כתיבה, אפס-דחיפה, אפס-עקיפה: הרצה מאמתת AEAD (scrypt+aes-256-gcm)
# בלבד ומדפיסה פסק-דין. לעולם לא נדפס הערך-עצמו — רק פסק-דין, אורך,
# וכתובות-ציבוריות שכבר-גלויות במטא וב-ledger.
#

name: seal-verify-main

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seal-verify-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the sovereign home (Zip — the seal target)
        uses: actions/checkout@v5
        with:
          repository: roshpinacare-sys/Zip
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 1

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: "Verdict (read-only) — does MAIN / MAIN_KEY open the live seal?"
        env:
          MAIN: ${{ secrets.MAIN }}
          MAIN_KEY: ${{ secrets.MAIN_KEY }}
        run: |
          cat > /tmp/verify-seal.mjs <<'VERIFYEOF'
          import * as crypto from "node:crypto";
          import * as fs from "node:fs";
          const MAGIC = "WEAVE-CLOUD-SEAL-1";
          function parseSealFile(raw) {
            const lines = raw.split("\n").filter((l) => l.trim().length > 0);
            if (lines[0] !== MAGIC) throw new Error("bad magic");
            return lines.slice(1).join("");
          }
          function openSeal(hex, passphrase) {
            const payload = Buffer.from(hex, "hex");
            const salt = payload.subarray(0, 16);
            const iv = payload.subarray(16, 28);
            const tag = payload.subarray(28, 44);
            const ct = payload.subarray(44);
            const key = crypto.scryptSync(passphrase, salt, 32);
            const d = crypto.createDecipheriv("aes-256-gcm", key, iv);
            d.setAuthTag(tag);
            const p = JSON.parse(Buffer.concat([d.update(ct), d.final()]).toString("utf8"));
            if (p.format !== MAGIC) throw new Error("bad content");
            return p;
          }
          const hex = parseSealFile(fs.readFileSync("sovereign/weave-seal.enc", "utf8"));
          const meta = JSON.parse(fs.readFileSync("sovereign/weave-seal.meta.json", "utf8"));
          console.log(`[seal-verify-main] live seal: ${hex.length} hex-chars · meta.rotatedAt=${meta.rotatedAt || "?"} · meta.cloudAddress=${meta.cloudAddress || "?"}`);
          const verdict = {};
          for (const name of ["MAIN", "MAIN_KEY"]) {
            const v = String(process.env[name] || "").trim();
            if (!v) { verdict[name] = "ABSENT"; continue; }
            try {
              const p = openSeal(hex, v);
              verdict[name] = `OPENS (cloud=${p.cloudAddress} · network=${p.networkAddress})`;
            } catch {
              verdict[name] = `DOES-NOT-OPEN (len=${v.length})`;
            }
          }
          let equal = false;
          try {
            const a = Buffer.from(String(process.env.MAIN || "").trim());
            const b = Buffer.from(String(process.env.MAIN_KEY || "").trim());
            equal = a.length > 0 && a.length === b.length && crypto.timingSafeEqual(a, b);
          } catch { equal = false; }
          verdict["MAIN≡MAIN_KEY"] = equal;
          console.log("[seal-verify-main] VERDICT " + JSON.stringify(verdict));
          VERIFYEOF
          node /tmp/verify-seal.mjs
